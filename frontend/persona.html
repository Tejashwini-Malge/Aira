<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="assets/aira-mark.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aira · Profile ready</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schoolbell&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/chalkboard.css">
<style>
* { margin: 0; padding: 0; }
body.board {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 40px 18px;
  text-align: center; opacity: 0; transition: opacity 0.6s ease;
}
body.loaded { opacity: 1; }
.wrap { max-width: 540px; width: 100%; position: relative; z-index: 1; }

/* chalk circle around the "A" — like the teacher circled it on the board */
.orb {
  width: 92px; height: 92px; border-radius: 50%; margin: 0 auto 30px;
  border: 3px dashed rgba(244,241,228,0.55);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--fd); font-size: 2.4rem; color: var(--chalk-yellow);
  text-shadow: 0 0 10px rgba(242,226,160,0.3);
  animation: pulse 2.6s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { transform: scale(1) rotate(-2deg); }
  50%     { transform: scale(1.05) rotate(2deg); }
}
h1 { font-family: var(--fd); font-size: 2rem; line-height: 1.3; color: var(--chalk); margin: 12px 0 16px; text-shadow: 0 0 1px rgba(255,255,255,0.5); }
p.lead { font-size: 0.95rem; color: var(--muted); line-height: 1.7; margin-bottom: 12px; }
p.fine { font-size: 0.84rem; color: var(--chalk-faint); line-height: 1.6; margin-bottom: 34px; font-style: italic; }

.spinner {
  width: 38px; height: 38px; margin: 0 auto 20px;
  border: 3px dashed rgba(244,241,228,0.4); border-top-color: var(--chalk-yellow);
  border-radius: 50%; animation: spin 1.1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.err { color: #eaacb8; font-size: 0.88rem; margin-top: 14px; min-height: 18px; }
</style>
<link rel="stylesheet" href="assets/guide.css">
</head>
<body class="board">
  <div class="wrap" id="root"></div>

<script src="assets/aira.js"></script>
<script>
const API_BASE = "";

function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function renderBuilding() {
  document.getElementById('root').innerHTML = `
    <div class="spinner"></div>
    <div class="chalk-tag">Reading your answers</div>
    <h1>Aira is getting to know you…</h1>
    <p class="lead">Putting together a private picture of how you think, work, and communicate — like a teacher reading your first essay.</p>
  `;
}

function renderDone(name) {
  const first = (name || '').split(' ')[0] || 'there';
  document.getElementById('root').innerHTML = `
    <div class="orb">A</div>
    <div class="chalk-tag">Profile ready</div>
    <h1>I’ve got a real sense of you now, ${escHtml(first)}.</h1>
    <p class="lead">Your profile is built. From here on, your mock interviews and practice are shaped around how <em>you</em> actually work — no two students get the same Aira.</p>
    <p class="fine">Your profile stays private, like the notes a good teacher keeps. You don’t need to read it — you’ll feel it in everything that comes next.</p>
    <button class="btn-chalk primary" style="font-size:1.15rem;padding:12px 30px" onclick="window.location.href='Welcome.html'">Back to the classroom →</button>
  `;
}

function renderError(msg, name) {
  const noAnswers = (msg || '').includes('No onboarding responses') || (msg || '').includes('questions answered');
  const notEligible = (msg || '').includes('enough new session evidence');
  document.getElementById('root').innerHTML = `
    <div class="chalk-tag">One moment</div>
    <h1>${notEligible ? 'Not quite yet' : noAnswers ? 'Let’s finish your questions first' : 'That didn’t go through'}</h1>
    <p class="lead">${notEligible
      ? 'Your current profile is still Aira’s best read of you — it updates once there’s enough new practice evidence to act on.'
      : noAnswers
        ? 'Your answers weren’t saved yet — complete the questions and Aira will build your profile.'
        : escHtml(msg)}</p>
    <div style="margin-top:24px;">
      ${notEligible
        ? `<button class="btn-chalk primary" onclick="window.location.href='Welcome.html'">Back to the classroom →</button>`
        : noAnswers
          ? `<button class="btn-chalk primary" onclick="window.location.href='questions.html'">Go to questions →</button>`
          : `<button class="btn-chalk primary" onclick="build('${escHtml(name || '')}', true)">Try again</button>`}
    </div>
    <div class="err"></div>
  `;
}

async function build(name, force) {
  renderBuilding();
  try {
    // Trigger generation. We deliberately DO NOT display what comes back — the
    // persona is private and lives only on the server.
    await Aira.api(`${API_BASE}/session/generate-persona`, { method: 'POST', body: { force: !!force } });
    renderDone(name);
  } catch (err) {
    renderError(err.message || 'Please try again.', name);
  }
}

window.addEventListener('load', async () => {
  const user = await Aira.requireAuth();
  document.body.classList.add('loaded');
  const first = user.name || '';

  // Landing here via questions.html always carries ?refresh=1 — the user just
  // submitted answers (first build, or a deliberate refresh) and expects Aira to
  // actually act on them, so this always calls generate-persona with force:true
  // (harmless on a first build; gated server-side on a refresh).
  const justSubmitted = new URLSearchParams(location.search).get('refresh') === '1';
  if (justSubmitted) {
    build(first, true);
    return;
  }

  // Otherwise (direct nav, bookmark, back button): a persona is generated once and
  // cached server-side. This page used to always play the "reading your answers /
  // building" narrative regardless — so a returning visit LOOKED like it was
  // regenerating even though it was just fetching the same cached result in
  // milliseconds. Check readiness first so an already-built profile goes straight
  // to the done state.
  try {
    const check = await Aira.api(`${API_BASE}/me/persona`);
    if (check.persona && check.persona.ready) {
      renderDone(first);
      return;
    }
  } catch (e) {
    // Fall through — worst case we just run the normal build flow below.
  }
  build(first, false);
});
</script>
<script src="assets/guide.js"></script>
</body>
</html>
