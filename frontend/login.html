<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="assets/aira-mark.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aira · Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schoolbell&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/chalkboard.css">
<style>
* { margin: 0; padding: 0; }
html, body { height: 100%; }
body.board { display: flex; flex-direction: column; }
.page { flex: 1; display: flex; justify-content: center; padding: 32px 24px; position: relative; z-index: 1; overflow-y: auto; }

.auth-card {
  margin: auto;
  width: 100%; max-width: 420px;
  padding: 32px 32px 26px;
  background: rgba(16,32,24,0.55);
  border: 1px solid rgba(244,241,228,0.1);
  border-radius: 18px;
  box-shadow: 0 24px 56px rgba(0,0,0,0.32);
}

.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; text-decoration: none; }
.brand-badge {
  width: 34px; height: 34px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff, var(--chalk) 60%, #cfc9b0 100%);
  display: flex; align-items: center; justify-content: center;
  color: var(--board-dark); font-weight: 700; font-family: var(--fd); font-size: 1.05rem;
}
.brand-name { font-family: var(--fd); font-size: 1.15rem; color: var(--chalk); }
.brand-sub { font-size: 0.8rem; color: var(--muted); }

.form-heading { font-size: 2rem; margin-bottom: 6px; line-height: 1.2; }
.form-sub { font-size: 0.92rem; color: var(--muted); margin-bottom: 24px; line-height: 1.6; }

form { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
.field-group { display: flex; flex-direction: column; gap: 5px; }
label { font-size: 0.85rem; color: var(--chalk-dim); }
input[type="email"], input[type="password"] {
  padding: 12px 14px; border-radius: 9px; border: 1.5px solid rgba(244,241,228,0.2);
  background: rgba(244,241,228,0.05); color: var(--chalk);
  font-size: 0.95rem; font-family: var(--fb); transition: all 0.2s ease; width: 100%;
}
input::placeholder { color: rgba(244,241,228,0.35); }
input:focus {
  outline: none; border-color: var(--chalk-yellow);
  background: rgba(244,241,228,0.08); box-shadow: 0 0 0 3px rgba(242,226,160,0.14);
}

/* ── solid & secure buttons — matched to signup / landing page ── */
.btn-chalk {
  border: 1.5px solid rgba(244,241,228,0.3); border-radius: 10px;
  background: rgba(244,241,228,0.06); box-shadow: 0 2px 8px rgba(0,0,0,0.14);
}
.btn-chalk:hover { background: rgba(244,241,228,0.12); border-color: var(--chalk); border-style: solid; transform: translateY(-2px); }
.btn-chalk.primary {
  color: var(--board-dark);
  background: linear-gradient(180deg, #f8efc6, var(--chalk-yellow));
  border: 1.5px solid #e6d488; box-shadow: 0 6px 18px rgba(242,226,160,0.28); text-shadow: none;
}
.btn-chalk.primary:hover { background: linear-gradient(180deg, #fbf4d4, #f5e4a6); box-shadow: 0 9px 24px rgba(242,226,160,0.36); }

.microcopy { font-size: 0.85rem; color: var(--muted); text-align: center; margin-top: 14px; min-height: 1.3em; }
.new-here { margin-top: 16px; text-align: center; font-size: 0.88rem; color: var(--muted); }
.new-here a { color: var(--chalk-yellow); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

.remember-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: -4px; flex-wrap: wrap; }
.remember-check { display: flex; align-items: center; gap: 7px; font-size: 0.85rem; color: var(--chalk-dim); cursor: pointer; }
.remember-check input { width: auto; accent-color: var(--chalk-yellow); cursor: pointer; }
.remember-row a { font-size: 0.85rem; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.remember-row a:hover { color: var(--chalk-yellow); }
</style>
</head>
<body class="board">
<div class="page">

  <section class="auth-card">
    <a class="brand" href="index.html">
      <div class="brand-badge"></div>
      <div>
        <div class="brand-name">Aira</div>
        <div class="brand-sub">Never lose yourself in the moment that matters</div>
      </div>
    </a>

    <h2 class="chalk-title form-heading">Welcome back to class.</h2>
    <p class="form-sub chalk-sub">Your Persona, practice sessions and report card are right where you left them.</p>

    <form id="loginForm">
      <div class="field-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="field-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Your password" required>
      </div>
      <div class="remember-row">
        <label class="remember-check">
          <input type="checkbox" id="rememberMe">
          Stay signed in
        </label>
        <a onclick="window.location.href='forgot-password.html'">Forgot password?</a>
      </div>
    </form>

    <button class="btn-chalk primary" style="width:100%;font-size:1.15rem" onclick="handleLogin()">
      Mark me present →
    </button>

    <p class="microcopy" id="microcopy"></p>
    <p class="new-here">New here? <a onclick="window.location.href='signup.html'">Enrol yourself</a></p>
  </section>
</div>

<script>
const micEl = document.getElementById('microcopy');

async function handleLogin() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const remember = document.getElementById('rememberMe').checked;
  if (!email || !password) {
    micEl.style.color = '#eaacb8'; micEl.textContent = 'Enter your email and password.'; return;
  }
  micEl.style.color = '#f2e2a0'; micEl.textContent = 'Verifying…';
  try {
    const res = await fetch('/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, remember }),
      credentials: 'include'
    });
    const data = await res.json();
    if (res.ok && data.success) {
      micEl.textContent = 'Welcome back, ' + data.name + '. Loading your classroom…';
      // No localStorage mirror — every page now asks the server directly.
      // New users (no onboarding yet) go straight to onboarding; everyone else to the hub.
      let dest = 'Welcome.html';
      try {
        const o = await fetch('/onboarding/status', { credentials: 'include' });
        if (o.ok && !(await o.json()).complete) dest = 'onboarding.html';
      } catch (e) {}
      setTimeout(() => { window.location.href = dest; }, 800);
    } else {
      micEl.style.color = '#eaacb8';
      micEl.textContent = data.message || 'Incorrect email or password.';
    }
  } catch(e) {
    micEl.style.color = '#eaacb8'; micEl.textContent = 'Could not reach the server. Is it running?';
  }
}
document.getElementById('loginForm').addEventListener('submit', e => { e.preventDefault(); handleLogin(); });
</script>
<script src="assets/brand.js"></script>
</body>
</html>
