<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="assets/aira-mark.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aira · Reset Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schoolbell&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/chalkboard.css">
<style>
* { margin: 0; padding: 0; }
html, body { height: 100%; }
body.board { display: flex; flex-direction: column; }
.page { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; position: relative; z-index: 1; }

.auth-card {
  width: 100%; max-width: 420px;
  padding: 36px 34px 30px;
  background: rgba(0,0,0,0.12);
  border: 2px dashed var(--dash);
  border-radius: 12px;
}

.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
.brand-badge {
  width: 34px; height: 34px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff, var(--chalk) 60%, #cfc9b0 100%);
  display: flex; align-items: center; justify-content: center;
  color: var(--board-dark); font-weight: 700; font-family: var(--fd); font-size: 1.05rem;
}
.brand-name { font-family: var(--fd); font-size: 1.15rem; color: var(--chalk); }
.brand-sub { font-size: 0.8rem; color: var(--muted); }

.form-heading { font-size: 2rem; margin-bottom: 6px; line-height: 1.2; }
.form-sub { font-size: 0.92rem; color: var(--muted); margin-bottom: 24px; line-height: 1.6; }

form { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
.field-group { display: flex; flex-direction: column; gap: 5px; }
label { font-size: 0.85rem; color: var(--chalk-dim); }
input[type="password"] {
  padding: 12px 14px; border-radius: 8px; border: 1.5px dashed var(--dash);
  background: rgba(244,241,228,0.04); color: var(--chalk);
  font-size: 0.95rem; font-family: var(--fb); transition: all 0.2s ease; width: 100%;
}
input::placeholder { color: rgba(244,241,228,0.35); }
input:focus { outline: none; border-color: var(--chalk-yellow); border-style: solid; background: rgba(244,241,228,0.07); }

.microcopy { font-size: 0.85rem; color: var(--muted); text-align: center; margin-top: 14px; min-height: 1.3em; }
.new-here { margin-top: 16px; text-align: center; font-size: 0.88rem; color: var(--muted); }
.new-here a { color: var(--chalk-yellow); text-decoration: underline dashed; cursor: pointer; }
.hint { font-size: 0.8rem; color: var(--muted); margin-top: -8px; }
</style>
</head>
<body class="board">
<div class="page">

  <section class="auth-card">
    <div class="brand">
      <div class="brand-badge"></div>
      <div>
        <div class="brand-name">Aira</div>
        <div class="brand-sub">Never lose yourself in the moment that matters</div>
      </div>
    </div>

    <h2 class="chalk-title form-heading">Set a new password.</h2>
    <p class="form-sub chalk-sub">Choose something you'll remember — at least 8 characters.</p>

    <form id="resetForm">
      <div class="field-group">
        <label for="password">New password</label>
        <input type="password" id="password" placeholder="At least 8 characters" required>
      </div>
      <div class="field-group">
        <label for="confirm">Confirm new password</label>
        <input type="password" id="confirm" placeholder="Type it again" required>
      </div>
    </form>

    <button class="btn-chalk primary" style="width:100%;font-size:1.15rem" id="submitBtn" onclick="handleReset()">
      Update password →
    </button>

    <p class="microcopy" id="microcopy"></p>
    <p class="new-here">Link expired? <a onclick="window.location.href='forgot-password.html'">Request a new one</a></p>
  </section>
</div>

<script src="assets/aira.js"></script>
<script>
const micEl = document.getElementById('microcopy');
const btn = document.getElementById('submitBtn');
const token = new URLSearchParams(window.location.search).get('token') || '';

if (!token) {
  micEl.style.color = '#eaacb8';
  micEl.textContent = 'This link is missing its token. Request a new one below.';
  btn.disabled = true;
}

async function handleReset() {
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;
  if (password.length < 8) {
    micEl.style.color = '#eaacb8'; micEl.textContent = 'Password must be at least 8 characters.'; return;
  }
  if (password !== confirm) {
    micEl.style.color = '#eaacb8'; micEl.textContent = 'Passwords do not match.'; return;
  }
  btn.disabled = true;
  micEl.style.color = '#f2e2a0'; micEl.textContent = 'Updating…';
  try {
    await Aira.api('/account/reset-password', { body: { token, password } });
    micEl.style.color = '#b7d9a8';
    micEl.textContent = 'Password updated. Taking you to login…';
    setTimeout(() => { window.location.href = 'login.html'; }, 1200);
  } catch (e) {
    micEl.style.color = '#eaacb8';
    micEl.textContent = e.message || 'Could not reset your password.';
    btn.disabled = false;
  }
}
document.getElementById('resetForm').addEventListener('submit', e => { e.preventDefault(); handleReset(); });
</script>
<script src="assets/brand.js"></script>
</body>
</html>
