<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aira · Voice Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0C0A07; --card: rgba(255,244,224,0.04); --card-hover: rgba(255,244,224,0.07);
  --border: rgba(202,156,77,0.18); --border-bright: rgba(202,156,77,0.38);
  --gold: #C9A46E; --gold-light: #E8C97A; --cream: #F2E8D8; --muted: #9B8E7E;
  --danger: #C17B5A;
  --r: 16px; --fd: 'Playfair Display', Georgia, serif; --fb: 'Inter', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--fb); background: var(--bg); color: var(--cream);
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 24px 16px;
  position: relative;
}
body::before {
  content: ''; position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
  width: 600px; height: 400px;
  background: radial-gradient(ellipse, rgba(196,149,58,0.06) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}

.layout {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center;
  width: 100%; max-width: 600px;
  animation: fadeUp 0.6s ease forwards;
}
@keyframes fadeUp { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform: translateY(0); } }

/* Header */
.header {
  width: 100%; display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 24px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-badge {
  width: 32px; height: 32px; border-radius: 50%;
  background: radial-gradient(circle at 30% 20%, #F2E8D8 0%, #C9A46E 55%, #8B6520 100%);
  display: flex; align-items: center; justify-content: center;
  color: #0C0A07; font-weight: 700; font-size: 0.85rem;
  box-shadow: 0 0 16px rgba(201,164,110,0.3);
}
.brand-name { font-family: var(--fd); font-size: 0.95rem; font-weight: 600; color: var(--cream); }
.brand-sub { font-size: 0.7rem; color: var(--muted); }
.nav-back { font-size: 0.76rem; color: var(--muted); cursor: pointer; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--border); transition: all 0.2s; }
.nav-back:hover { color: var(--cream); border-color: var(--border-bright); }

/* Practice card */
.practice-card {
  width: 100%; background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r); padding: 24px 22px;
  display: flex; flex-direction: column; gap: 16px;
}

.calm-note { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; color: var(--muted); font-style: italic; }
.calm-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 3px rgba(201,164,110,0.2); flex-shrink: 0; }

/* Mode toggle */
.mode-toggle { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; border: 1px solid var(--border); background: rgba(255,244,224,0.02); align-self: flex-start; }
.mode-pill {
  font-size: 0.76rem; padding: 5px 12px; border-radius: 999px;
  border: none; background: transparent; color: var(--muted);
  cursor: pointer; font-family: var(--fb); transition: all 0.2s;
}
.mode-pill.active { background: linear-gradient(135deg, #C9A46E, #E8C97A); color: #0C0A07; font-weight: 600; }

/* Question */
.q-meta { display: flex; align-items: center; gap: 10px; }
.q-pill { padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); font-size: 0.72rem; color: var(--gold); }
.progress-track { flex: 1; height: 4px; border-radius: 999px; background: rgba(255,244,224,0.07); overflow: hidden; }
.progress-bar { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, #C9A46E, #E8C97A); transition: width 0.35s ease-out; }
.step-text { font-size: 0.72rem; color: var(--muted); }

.question-text { font-family: var(--fd); font-size: 1.15rem; line-height: 1.55; color: var(--cream); }

/* Textarea */
.input-group { position: relative; }
textarea {
  width: 100%; height: 130px; padding: 12px 50px 12px 14px;
  border-radius: 10px; border: 1px solid var(--border);
  background: rgba(255,244,224,0.03); color: var(--cream);
  font-size: 0.9rem; font-family: var(--fb); resize: none; line-height: 1.6;
  transition: all 0.2s;
}
textarea:focus { outline: none; border-color: rgba(201,164,110,0.45); background: rgba(255,244,224,0.05); box-shadow: 0 0 0 3px rgba(201,164,110,0.08); }
textarea::placeholder { color: rgba(155,142,126,0.5); }

#mic-btn {
  position: absolute; bottom: 12px; right: 12px;
  background: rgba(255,244,224,0.05); border: 1px solid var(--border);
  cursor: pointer; padding: 8px; border-radius: 999px; color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
#mic-btn:hover { border-color: var(--border-bright); color: var(--cream); }
#mic-btn svg { width: 20px; height: 20px; fill: currentColor; }
#mic-btn.listening { color: var(--danger); border-color: rgba(193,123,90,0.5); background: rgba(193,123,90,0.08); animation: micPulse 1.6s ease-out infinite; }
@keyframes micPulse { 0% { box-shadow: 0 0 0 0 rgba(193,123,90,0.3); } 70% { box-shadow: 0 0 0 12px rgba(193,123,90,0); } 100% { box-shadow: 0 0 0 0 rgba(193,123,90,0); } }

.helper-row { display: flex; align-items: center; justify-content: space-between; font-size: 0.76rem; color: var(--muted); }

/* Button row */
.btn-row { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
.btn-skip { background: none; border: none; font-size: 0.82rem; color: var(--muted); cursor: pointer; font-family: var(--fb); padding: 4px 0; }
.btn-skip:hover { color: var(--cream); }
.btn-primary {
  padding: 10px 22px; border-radius: 10px; border: none;
  background: linear-gradient(135deg, #C9A46E, #E8C97A, #C9A46E);
  color: #0C0A07; font-size: 0.88rem; font-weight: 700; font-family: var(--fb);
  cursor: pointer; transition: all 0.2s; box-shadow: 0 6px 18px rgba(201,164,110,0.22);
}
.btn-primary:hover { box-shadow: 0 8px 22px rgba(201,164,110,0.35); transform: translateY(-1px); }
.btn-primary:disabled { opacity: 0.5; cursor: default; transform: none; }

/* Toast */
#toast {
  visibility: hidden; position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  padding: 10px 18px; border-radius: 999px; font-size: 0.82rem;
  background: rgba(30,24,16,0.95); border: 1px solid var(--border);
  color: var(--cream); opacity: 0; transition: opacity 0.25s, bottom 0.25s;
  box-shadow: 0 12px 30px rgba(0,0,0,0.6); z-index: 100;
}
#toast.show { visibility: visible; opacity: 1; bottom: 40px; }
#toast.success { border-color: rgba(201,164,110,0.5); color: var(--gold); }

@media (max-width: 480px) { .practice-card { padding: 18px 16px; } }
</style>
</head>
<body>
<div class="layout">
  <div class="header">
    <div class="brand">
      <div class="brand-badge">A</div>
      <div>
        <div class="brand-name">Aira</div>
        <div class="brand-sub">Voice practice</div>
      </div>
    </div>
    <div class="nav-back" onclick="window.location.href='Welcome.html'">‹ Hub</div>
  </div>

  <div class="practice-card">
    <div class="calm-note">
      <div class="calm-dot"></div>
      There's no right or wrong answer. Just share what comes to mind.
    </div>

    <div class="mode-toggle">
      <button class="mode-pill active" id="modePromptBtn">Prompt &amp; speak</button>
      <button class="mode-pill" id="modeFreeBtn">Free speak</button>
    </div>

    <div class="q-meta">
      <div class="q-pill" id="intentLabel">Practice session</div>
      <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
      <div class="step-text" id="stepLabel">0 / 0</div>
    </div>

    <div class="question-text" id="question">Loading…</div>

    <div class="input-group">
      <textarea id="answer" placeholder="You can type, or click the mic and simply speak."></textarea>
      <button id="mic-btn" aria-label="Toggle voice recording">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
      </button>
    </div>

    <div class="helper-row">
      <span id="helperCopy">Take your time. A few sentences are enough.</span>
      <span id="micStatus">Mic off</span>
    </div>

    <div class="btn-row">
      <button class="btn-skip" id="skipBtn">Skip</button>
      <button class="btn-primary" id="continueBtn">Continue →</button>
    </div>
  </div>
</div>

<div id="toast">Notification</div>

<script>
let questions = [], answers = [], index = 0, mode = "prompt";
const intent = localStorage.getItem("intent") || "general communication practice";
const qEl = document.getElementById("question");
const aEl = document.getElementById("answer");
const micBtn = document.getElementById("mic-btn");
const helperEl = document.getElementById("helperCopy");
const micStatusEl = document.getElementById("micStatus");
const intentEl = document.getElementById("intentLabel");
const progressBar = document.getElementById("progressBar");
const stepEl = document.getElementById("stepLabel");
const continueBtn = document.getElementById("continueBtn");
const skipBtn = document.getElementById("skipBtn");

const intentMap = {
  "speaking confidently as a fresher": "Speaking as a fresher",
  "handling challenges calmly": "Handling challenges",
  "responding to feedback clearly": "Responding to feedback",
  "general communication practice": "Communication practice"
};
intentEl.textContent = intentMap[intent] || "Practice session";

function fetchQuestions() {
  return new Promise(resolve => setTimeout(() => resolve({ questions: [
    "Tell me about a challenge you overcame recently.",
    "What is your favourite way to recharge after a long day?",
    "Describe a skill you would like to develop in the next six months."
  ]}), 500));
}

function updateProgress() {
  if (mode === "free") { progressBar.style.width = "100%"; stepEl.textContent = "Free mode"; return; }
  const t = questions.length || 1, c = Math.min(index + 1, t);
  progressBar.style.width = (c / t * 100) + "%";
  stepEl.textContent = c + " / " + t;
}

function setHelper() {
  if (mode === "free") { helperEl.textContent = "Speak for 45–90 seconds. Aira will listen and give feedback."; return; }
  const q = (questions[index] || "").toLowerCase();
  if (q.includes("challenge")) helperEl.textContent = "Describe what happened, what you did, and what you learned.";
  else if (q.includes("recharge") || q.includes("relax")) helperEl.textContent = "Paint a small picture — where you are, what you do, how it feels.";
  else helperEl.textContent = "A few honest sentences are enough. No perfect answer needed.";
}

function setModePrompt() {
  mode = "prompt";
  document.getElementById("modePromptBtn").classList.add("active");
  document.getElementById("modeFreeBtn").classList.remove("active");
  continueBtn.textContent = "Continue →";
  skipBtn.style.display = "inline";
  qEl.textContent = questions.length ? questions[index] : "Loading…";
  updateProgress(); setHelper();
}
function setModeFree() {
  mode = "free";
  document.getElementById("modeFreeBtn").classList.add("active");
  document.getElementById("modePromptBtn").classList.remove("active");
  continueBtn.textContent = "Finish & review →";
  skipBtn.style.display = "none";
  qEl.textContent = "Just start speaking about your day, your week, or your current goal.";
  updateProgress(); setHelper();
}
document.getElementById("modePromptBtn").addEventListener("click", setModePrompt);
document.getElementById("modeFreeBtn").addEventListener("click", setModeFree);

fetchQuestions().then(data => {
  questions = data.questions; index = 0;
  if (mode === "prompt") qEl.textContent = questions[index];
  updateProgress(); setHelper();
});

continueBtn.addEventListener("click", () => {
  const current = aEl.value.trim();
  if (!current) { showToast("Try at least one sentence first."); return; }
  answers.push(current); aEl.value = ""; stopListening();
  if (mode === "free") {
    continueBtn.disabled = true; continueBtn.textContent = "Saving…";
    localStorage.setItem("answers", JSON.stringify(answers));
    localStorage.setItem("mode", "free");
    localStorage.setItem("aira_skills_done", "true");
    showToast("Good work. Taking you to reflection.", true);
    setTimeout(() => { window.location.href = "reflection.html"; }, 1500);
    return;
  }
  index++;
  if (index < questions.length) {
    qEl.textContent = questions[index]; updateProgress(); setHelper(); aEl.focus();
  } else {
    continueBtn.disabled = true; continueBtn.textContent = "Saving…";
    localStorage.setItem("answers", JSON.stringify(answers));
    localStorage.setItem("mode", "prompt");
    localStorage.setItem("aira_skills_done", "true");
    showToast("Practice complete. Taking you to reflection.", true);
    setTimeout(() => { window.location.href = "reflection.html"; }, 1500);
  }
});

skipBtn.addEventListener("click", () => {
  if (mode === "free") return;
  answers.push("[Skipped]"); index++;
  if (index < questions.length) {
    qEl.textContent = questions[index]; updateProgress(); setHelper();
    aEl.value = ""; aEl.focus(); showToast("Skipped. Next prompt.");
  } else {
    localStorage.setItem("answers", JSON.stringify(answers));
    localStorage.setItem("mode", "prompt");
    showToast("End reached. Moving to reflection.", true);
    setTimeout(() => { window.location.href = "reflection.html"; }, 1400);
  }
});

// Speech recognition
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog, isListening = false;
if (SR) {
  recog = new SR();
  recog.continuous = false; recog.interimResults = true; recog.lang = "en-US";
  recog.onstart = () => { isListening = true; micBtn.classList.add("listening"); aEl.placeholder = "You're live. Speak as you would in an interview."; micStatusEl.textContent = "Listening…"; };
  recog.onend = () => { isListening = false; micBtn.classList.remove("listening"); aEl.placeholder = "You can type, or click the mic and simply speak."; micStatusEl.textContent = "Mic off"; };
  recog.onresult = e => {
    let fin = "", int = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) fin += e.results[i][0].transcript;
      else int += e.results[i][0].transcript;
    }
    if (int) aEl.value = (aEl.value || "").trim() + " " + int;
    if (fin) aEl.value = aEl.value.trim() + (aEl.value.trim() ? " " : "") + fin;
  };
  recog.onerror = e => { stopListening(); showToast(e.error === "not-allowed" ? "Mic blocked. Type your answer instead." : "Mic error: " + e.error); };
  micBtn.addEventListener("click", () => { isListening ? stopListening() : recog.start(); });
} else { micBtn.style.display = "none"; micStatusEl.textContent = "Mic not supported"; }

function stopListening() { if (recog && isListening) recog.stop(); }

function showToast(msg, success = false) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "show" + (success ? " success" : "");
  setTimeout(() => { t.className = ""; }, 2600);
}
</script>
</body>
</html>
