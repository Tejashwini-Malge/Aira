<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="assets/aira-mark.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aira · Voice Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schoolbell&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/chalkboard.css">
<style>
* { margin: 0; padding: 0; }
body.board {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 24px 16px;
}

.layout {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center;
  width: 100%; max-width: 600px;
  animation: fadeUp 0.6s ease forwards;
}
@keyframes fadeUp { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform: translateY(0); } }

/* Header */
.header {
  width: 100%; display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 24px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-badge {
  width: 32px; height: 32px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff, var(--chalk) 60%, #cfc9b0 100%);
  display: flex; align-items: center; justify-content: center;
  color: var(--board-dark); font-weight: 700; font-family: var(--fd); font-size: 1rem;
}
.brand-name { font-family: var(--fd); font-size: 1.05rem; color: var(--chalk); }
.brand-sub { font-size: 0.8rem; color: var(--muted); }
.nav-back { font-size: 0.8rem; color: var(--muted); cursor: pointer; padding: 5px 12px; border-radius: 999px; border: 1.5px dashed var(--dash); transition: all 0.2s; }
.nav-back:hover { color: var(--chalk); border-color: var(--chalk); }

/* Practice card — standing at the board */
.practice-card {
  width: 100%; padding: 24px 22px;
  display: flex; flex-direction: column; gap: 16px;
}

.calm-note { display: flex; align-items: center; gap: 8px; font-size: 0.84rem; color: var(--muted); font-style: italic; }
.calm-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--chalk-yellow); flex-shrink: 0; }

/* Coach reaction line */
.reaction { font-size: 0.86rem; color: var(--chalk-yellow); font-style: italic; display: none; }
.reaction.show { display: block; }

/* Question */
.q-meta { display: flex; align-items: center; gap: 10px; }
.q-pill { padding: 3px 10px; border-radius: 999px; border: 1.5px dashed rgba(242,226,160,0.4); font-size: 0.8rem; color: var(--chalk-yellow); }
.diff-pill { padding: 3px 10px; border-radius: 999px; border: 1.5px dashed var(--dash); font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
.progress-track { flex: 1; height: 5px; border-radius: 999px; background: rgba(244,241,228,0.08); overflow: hidden; border: 1px dashed var(--dash); }
.progress-bar { height: 100%; width: 0%; border-radius: 999px; background: repeating-linear-gradient(90deg, var(--chalk) 0 5px, transparent 5px 8px); transition: width 0.35s ease-out; }
.step-text { font-size: 0.8rem; color: var(--muted); }

.question-text { font-family: var(--fd); font-size: 1.3rem; line-height: 1.5; color: var(--chalk); text-shadow: 0 0 1px rgba(255,255,255,0.4); }

/* Textarea */
.input-group { position: relative; }
textarea {
  width: 100%; height: 130px; padding: 12px 50px 12px 14px;
  border-radius: 8px; border: 1.5px dashed var(--dash);
  background: rgba(244,241,228,0.04); color: var(--chalk);
  font-size: 0.94rem; font-family: var(--fb); resize: none; line-height: 1.6;
  transition: all 0.2s;
}
textarea:focus { outline: none; border-color: var(--chalk-yellow); border-style: solid; background: rgba(244,241,228,0.07); }
textarea::placeholder { color: rgba(244,241,228,0.3); }

#mic-btn {
  position: absolute; bottom: 12px; right: 12px;
  background: rgba(244,241,228,0.06); border: 1.5px dashed var(--dash);
  cursor: pointer; padding: 8px; border-radius: 999px; color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
#mic-btn:hover { border-color: var(--chalk); color: var(--chalk); }
#mic-btn svg { width: 20px; height: 20px; fill: currentColor; }
#mic-btn.listening { color: var(--chalk-pink); border-color: rgba(234,172,184,0.6); border-style: solid; background: rgba(234,172,184,0.08); animation: micPulse 1.6s ease-out infinite; }
@keyframes micPulse { 0% { box-shadow: 0 0 0 0 rgba(234,172,184,0.3); } 70% { box-shadow: 0 0 0 12px rgba(234,172,184,0); } 100% { box-shadow: 0 0 0 0 rgba(234,172,184,0); } }

.helper-row { display: flex; align-items: center; justify-content: space-between; font-size: 0.8rem; color: var(--muted); }

/* Button row */
.btn-row { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
.btn-skip { background: none; border: none; font-size: 0.84rem; color: var(--muted); cursor: pointer; font-family: var(--fb); padding: 4px 0; text-decoration: underline dashed; }
.btn-skip:hover { color: var(--chalk); }

/* Toast */
#toast {
  visibility: hidden; position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  padding: 10px 18px; border-radius: 999px; font-size: 0.84rem;
  background: rgba(18,38,28,0.97); border: 1.5px dashed var(--dash);
  color: var(--chalk); opacity: 0; transition: opacity 0.25s, bottom 0.25s;
  box-shadow: 0 12px 30px rgba(0,0,0,0.6); z-index: 100; font-family: var(--fb);
}
#toast.show { visibility: visible; opacity: 1; bottom: 40px; }
#toast.success { border-color: rgba(242,226,160,0.6); color: var(--chalk-yellow); }

@media (max-width: 480px) { .practice-card { padding: 18px 16px; } }
</style>
</head>
<body class="board">
<div class="layout">
  <div class="header">
    <div class="brand">
      <div class="brand-badge"></div>
      <div>
        <div class="brand-name">Aira</div>
        <div class="brand-sub">Stand and deliver</div>
      </div>
    </div>
    <div class="nav-back" onclick="window.location.href='soft_skills.html'">‹ Tracks</div>
  </div>

  <div class="practice-card board-card pin-yellow">
    <div class="calm-note">
      <div class="calm-dot"></div>
      Aira adapts each question to how you answer. Just share what comes to mind.
    </div>

    <div class="reaction" id="reaction"></div>

    <div class="q-meta">
      <div class="q-pill" id="intentLabel">Practice session</div>
      <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
      <div class="step-text" id="stepLabel">0 / 0</div>
      <div class="diff-pill" id="diffPill" style="display:none">Level 2</div>
    </div>

    <div class="question-text" id="question">Loading…</div>

    <div class="input-group">
      <textarea id="answer" placeholder="You can type, or click the mic and simply speak."></textarea>
      <button id="mic-btn" aria-label="Toggle voice recording">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
      </button>
    </div>

    <div class="helper-row">
      <span id="helperCopy">Take your time. A few sentences are enough.</span>
      <span id="micStatus">Mic off</span>
    </div>

    <div class="btn-row">
      <button class="btn-skip" id="skipBtn">Skip</button>
      <button class="btn-chalk primary" id="continueBtn" disabled>Continue →</button>
    </div>
  </div>
</div>

<div id="toast">Notification</div>

<script src="assets/aira.js"></script>
<script>
// ---- Session state: the server holds the real history; we only send answers. ----
const params = new URLSearchParams(window.location.search);
const track = params.get("track") || "communication";
const projectId = params.get("project_id");

let total = 0, answered = 0, busy = false, finished = false;
// Client-measured delivery metrics (by design these are browser-side: pace,
// filler words, word count). They ride along to /comm/evaluate as `metrics`.
const metrics = { words: 0, fillers: 0, startedAt: null };
const transcript = []; // {prompt, answer} — for display on the reflection page only

const qEl = document.getElementById("question");
const aEl = document.getElementById("answer");
const micBtn = document.getElementById("mic-btn");
const helperEl = document.getElementById("helperCopy");
const micStatusEl = document.getElementById("micStatus");
const intentEl = document.getElementById("intentLabel");
const progressBar = document.getElementById("progressBar");
const stepEl = document.getElementById("stepLabel");
const diffPill = document.getElementById("diffPill");
const reactionEl = document.getElementById("reaction");
const continueBtn = document.getElementById("continueBtn");
const skipBtn = document.getElementById("skipBtn");

function countFillers(text) {
  const m = String(text).toLowerCase().match(/\b(um+|uh+|erm+|like|you know|basically|actually|literally)\b/g);
  return m ? m.length : 0;
}
function countWords(text) {
  return String(text).split(/\s+/).filter(Boolean).length;
}

function renderBeat(beat) {
  qEl.textContent = beat.prompt;
  helperEl.textContent = beat.hint || "A few honest sentences are enough.";
  diffPill.textContent = "Level " + (beat.difficulty || "?") + " / 5";
  diffPill.style.display = "inline-block";
  const shown = Math.min(answered + 1, total || 1);
  progressBar.style.width = ((shown / (total || 1)) * 100) + "%";
  stepEl.textContent = shown + " / " + (total || "?");
  continueBtn.textContent = (answered + 1 >= total) ? "Finish & review →" : "Continue →";
  aEl.value = "";
  aEl.focus();
}

async function startSession() {
  if (!metrics.startedAt) metrics.startedAt = Date.now();
  try {
    const res = await fetch("/comm/start", {
      method: "POST", headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ track: track, project_id: projectId })
    });
    if (res.status === 401) { window.location.replace("login.html"); return; }
    const data = await res.json();
    if (!res.ok || !data.beat) throw new Error(data.error || "Could not start the session.");
    total = data.total || 5;
    intentEl.textContent = data.label || "Practice session";
    transcript.push({ prompt: data.beat.prompt, answer: null });
    renderBeat(data.beat);
    continueBtn.disabled = false;
  } catch (err) {
    qEl.textContent = "Could not start the session. Is the server running?";
    helperEl.textContent = err.message || "";
  }
}

async function sendAnswer(answerText) {
  if (busy || finished) return;
  busy = true;
  stopListening();
  continueBtn.disabled = true;
  continueBtn.textContent = "Thinking…";

  metrics.words += countWords(answerText);
  metrics.fillers += countFillers(answerText);
  transcript[transcript.length - 1].answer = answerText;

  try {
    const res = await fetch("/comm/next", {
      method: "POST", headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ answer: answerText })
    });
    if (res.status === 401) { window.location.replace("login.html"); return; }
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Something went wrong.");

    answered++;
    if (data.done) {
      finished = true;
      finishSession();
      return;
    }
    if (data.reaction) {
      reactionEl.textContent = data.reaction;
      reactionEl.classList.add("show");
    }
    transcript.push({ prompt: data.beat.prompt, answer: null });
    renderBeat(data.beat);
  } catch (err) {
    showToast(err.message || "Could not reach Aira. Try again.");
    continueBtn.textContent = "Continue →";
  } finally {
    busy = false;
    continueBtn.disabled = finished;
  }
}

async function finishSession() {
  const minutes = Math.max((Date.now() - metrics.startedAt) / 60000, 0.25);
  const payload = {
    track: track,
    metrics: {
      words: metrics.words,
      fillers: metrics.fillers,
      wpm: Math.round(metrics.words / minutes)
    },
    transcript: transcript
  };

  // The period is over — ring the school bell and grade the paper RIGHT HERE,
  // while the student is still at the board. The reflection page then opens with
  // the verdict already in hand instead of blocking on its own evaluate call.
  Aira.ringBell();
  qEl.textContent = "🔔 Pens down!";
  helperEl.textContent = "Aira is going through your answer sheet…";
  reactionEl.classList.remove("show");
  continueBtn.textContent = "Correcting…";
  showToast("The bell has rung — Aira is correcting your paper…", true);

  try {
    const res = await fetch("/comm/evaluate", {
      method: "POST", headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ metrics: payload.metrics })
    });
    const data = await res.json();
    if (res.ok && data.feedback) payload.feedback = data.feedback;
    // On failure the hand-off simply has no feedback — the reflection page falls
    // back to running the evaluation itself (the session is only spent on success).
  } catch (e) { /* same fallback */ }

  sessionStorage.setItem("aira_comm_session", JSON.stringify(payload));
  window.location.href = "reflection.html";
}

continueBtn.addEventListener("click", () => {
  const current = aEl.value.trim();
  if (!current) { showToast("Try at least one sentence first."); return; }
  sendAnswer(current);
});

skipBtn.addEventListener("click", () => {
  if (busy || finished) return;
  sendAnswer("");
  showToast("Skipped — a blank answer counts as weak.");
});

startSession();

// Speech recognition — stays on until YOU turn it off.
// The browser ends recognition on its own after any silence, so `wantListening`
// tracks the user's intent and onend auto-restarts while it's still true.
//
// `baseText` is the authoritative record of FINALISED speech. It is never re-read
// from the textarea: aEl.value is base + interim, so snapshotting it on restart
// promoted un-finalised interim into the base. On mobile Chrome, which ignores
// `continuous` and ends recognition constantly, that looped once per revision and
// grew the answer into tens of thousands of characters of the same sentence
// ("so / so basically / so basically the / so basically the interest…").
// Pending interim is dropped on restart instead — losing a trailing part-word beats
// duplicating the whole answer. appendSpeech() strips any overlap as a second line
// of defence in case the engine replays audio it already gave us.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const MAX_ANSWER_CHARS = 3000;
let recog, isListening = false, wantListening = false, baseText = "";

// Append `add` to `base`, skipping the longest run of trailing words in `base`
// that `add` repeats. "the interest for" + "for admission" -> "the interest for admission".
function appendSpeech(base, add) {
  const b = base.trim().split(/\s+/).filter(Boolean);
  const a = add.trim().split(/\s+/).filter(Boolean);
  if (!a.length) return base;
  const max = Math.min(b.length, a.length, 30);
  let overlap = 0;
  for (let k = max; k > 0; k--) {
    if (b.slice(b.length - k).join(" ").toLowerCase() === a.slice(0, k).join(" ").toLowerCase()) { overlap = k; break; }
  }
  return b.concat(a.slice(overlap)).join(" ") + " ";
}
if (SR) {
  recog = new SR();
  recog.continuous = true; recog.interimResults = true; recog.lang = "en-US";
  recog.onstart = () => { isListening = true; micBtn.classList.add("listening"); aEl.placeholder = "You're live. Speak as you would in an interview."; micStatusEl.textContent = "Listening…"; };
  recog.onend = () => {
    isListening = false;
    if (wantListening) {
      // Silence timeout, not a user stop — resume from the finalised text only.
      // Do NOT re-snapshot aEl.value here; that is what caused the runaway growth.
      aEl.value = baseText.trim();
      try { recog.start(); return; } catch { wantListening = false; }
    }
    micBtn.classList.remove("listening");
    aEl.placeholder = "You can type, or click the mic and simply speak.";
    micStatusEl.textContent = "Mic off";
  };
  recog.onresult = e => {
    let fin = "", int = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) fin += e.results[i][0].transcript + " ";
      else int += e.results[i][0].transcript;
    }
    if (fin) baseText = appendSpeech(baseText, fin);
    if (baseText.length > MAX_ANSWER_CHARS) baseText = baseText.slice(0, MAX_ANSWER_CHARS);
    aEl.value = (baseText + int).trim().slice(0, MAX_ANSWER_CHARS);
  };
  recog.onerror = e => {
    if (e.error === "no-speech" || e.error === "aborted") return; // harmless; onend handles restart
    stopListening();
    showToast(e.error === "not-allowed" ? "Mic blocked. Type your answer instead." : "Mic error: " + e.error);
  };
  micBtn.addEventListener("click", () => {
    if (isListening || wantListening) { stopListening(); return; }
    wantListening = true;
    baseText = aEl.value.trim() ? aEl.value.trim() + " " : "";
    recog.start();
  });
} else { micBtn.style.display = "none"; micStatusEl.textContent = "Mic not supported"; }

function stopListening() {
  wantListening = false;
  if (recog && isListening) recog.stop();
}

function showToast(msg, success = false) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "show" + (success ? " success" : "");
  setTimeout(() => { t.className = ""; }, 2600);
}
</script>
<script src="assets/brand.js"></script>
</body>
</html>
