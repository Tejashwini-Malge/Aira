<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="assets/aira-mark.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aira · Questions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schoolbell&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/chalkboard.css">
<link rel="stylesheet" href="assets/guide.css">
<style>
* { margin: 0; padding: 0; }
body.board {
  display: flex; flex-direction: column;
  align-items: center; padding: 24px 16px 40px;
  opacity: 0; transition: opacity 0.5s ease;
}
body.loaded { opacity: 1; }

.header {
  max-width: 680px; width: 100%; display: flex;
  align-items: center; justify-content: space-between; margin-bottom: 20px; position: relative; z-index: 1;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-badge {
  width: 32px; height: 32px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff, var(--chalk) 60%, #cfc9b0 100%);
  display: flex; align-items: center; justify-content: center;
  color: var(--board-dark); font-weight: 700; font-family: var(--fd); font-size: 1rem;
}
.brand-name { font-family: var(--fd); font-size: 1.05rem; color: var(--chalk); }
.brand-sub { font-size: 0.8rem; color: var(--muted); }
.header-right { display: flex; align-items: center; gap: 8px; }
.step-pill { padding: 5px 12px; border-radius: 999px; border: 1.5px dashed rgba(242,226,160,0.4); font-size: 0.8rem; color: var(--chalk-yellow); }
.nav-back {
  font-size: 0.8rem; color: var(--muted); cursor: pointer;
  padding: 5px 12px; border-radius: 999px; border: 1.5px dashed var(--dash);
  transition: all 0.2s;
}
.nav-back:hover { color: var(--chalk); border-color: var(--chalk); }

.container { max-width: 680px; width: 100%; position: relative; z-index: 1; }

.progress-area { margin-bottom: 16px; }
.progress-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.progress-dots { display: flex; gap: 6px; }
.dot {
  width: 9px; height: 9px; border-radius: 50%;
  border: 1.5px dashed var(--dash); background: transparent;
  transition: all 0.3s ease;
}
.dot.done { background: rgba(244,241,228,0.5); border-style: solid; border-color: rgba(244,241,228,0.5); }
.dot.active { background: var(--chalk-yellow); border-style: solid; border-color: var(--chalk-yellow); transform: scale(1.15); }
.progress-pct { font-size: 0.8rem; color: var(--muted); }
.progress-track { height: 5px; border-radius: 999px; background: rgba(244,241,228,0.08); overflow: hidden; border: 1px dashed var(--dash); }
.progress-fill { height: 100%; width: 0; border-radius: 999px; background: repeating-linear-gradient(90deg, var(--chalk) 0 5px, transparent 5px 8px); transition: width 0.4s ease-out; }

.page-title { font-family: var(--fd); font-size: 1.55rem; color: var(--chalk); margin-bottom: 4px; text-shadow: 0 0 1px rgba(255,255,255,0.5); }
.page-sub { font-size: 0.85rem; color: var(--muted); margin-bottom: 14px; line-height: 1.5; }

.q-card { padding: 20px 22px; animation: fadeUp 0.4s ease forwards; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.q-meta { font-size: 0.8rem; color: var(--chalk-yellow); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 10px; opacity: 0.85; }
.q-text { font-family: var(--fd); font-size: 1.2rem; line-height: 1.5; color: var(--chalk); margin-bottom: 14px; }

/* Choice options — like options chalked on the board */
.options-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.option-card {
  padding: 10px 14px; border-radius: 8px;
  border: 1.5px dashed var(--dash);
  cursor: pointer; transition: all 0.18s ease;
  display: flex; align-items: flex-start; gap: 10px;
}
.option-card:hover { border-color: var(--chalk); background: rgba(244,241,228,0.05); }
.option-card.selected {
  border-color: var(--chalk-yellow); border-style: solid;
  background: rgba(242,226,160,0.07);
}
.option-letter {
  min-width: 24px; height: 24px; border-radius: 50%;
  border: 1.5px dashed var(--dash); display: flex; align-items: center;
  justify-content: center; font-size: 0.8rem; font-weight: 700;
  color: var(--muted); flex-shrink: 0; margin-top: 1px;
  transition: all 0.18s ease;
}
.option-card.selected .option-letter {
  background: var(--chalk-yellow); border-color: var(--chalk-yellow); border-style: solid; color: var(--board-dark);
}
.option-text { font-size: 0.9rem; color: var(--muted); line-height: 1.55; transition: color 0.18s; }
.option-card.selected .option-text { color: var(--chalk); }

/* Text input — write on the slate */
textarea {
  width: 100%; min-height: 100px; padding: 12px 14px;
  border-radius: 8px; border: 1.5px dashed var(--dash);
  background: rgba(244,241,228,0.04); color: var(--chalk);
  font-size: 0.92rem; font-family: var(--fb); resize: vertical;
  transition: all 0.2s ease; line-height: 1.6;
}
textarea::placeholder { color: rgba(244,241,228,0.3); }
textarea:focus { outline: none; border-color: var(--chalk-yellow); border-style: solid; background: rgba(244,241,228,0.07); }

/* Speaking is offered, never required — SpeechRecognition is missing in Firefox
   and flaky on iOS Safari, and persona is the one step that currently completes.
   The mic hides itself when unsupported and the textarea carries on alone. */
.speak-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.mic-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 16px; border-radius: 999px; cursor: pointer;
  border: 1.5px dashed var(--chalk-pink); background: rgba(234,172,184,0.08);
  color: var(--chalk-pink); font-family: var(--fb); font-size: 0.86rem;
  transition: all 0.18s ease;
}
.mic-btn:hover { background: rgba(234,172,184,0.16); }
.mic-btn.listening { border-style: solid; background: rgba(234,172,184,0.2); color: var(--chalk); animation: micPulse 1.4s ease-in-out infinite; }
@keyframes micPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(234,172,184,0.4); } 50% { box-shadow: 0 0 0 7px rgba(234,172,184,0); } }
.mic-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.mic-status { font-size: 0.8rem; color: var(--chalk-yellow); font-style: italic; }
.speak-note { font-size: 0.78rem; color: var(--muted); }

/* Warm-up: the first spoken rep, before any of it counts for anything. */
.warmup-tag { font-size: 0.8rem; color: var(--chalk-pink); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 10px; }
.warmup-q { font-family: var(--fd); font-size: 1.35rem; line-height: 1.5; color: var(--chalk); margin-bottom: 8px; }
.warmup-sub { font-size: 0.85rem; color: var(--muted); line-height: 1.55; margin-bottom: 14px; }
.skip-link { font-size: 0.82rem; color: var(--muted); cursor: pointer; text-decoration: underline dotted; background: none; border: none; font-family: var(--fb); }
.skip-link:hover { color: var(--chalk); }

.q-footer {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  margin-top: 16px; padding-top: 12px;
  position: sticky; bottom: 12px;
  background: rgba(18,38,28,0.94); backdrop-filter: blur(6px);
  border: 1.5px dashed var(--dash); border-radius: 10px;
  padding: 12px 14px;
}
.helper { font-size: 0.8rem; color: var(--muted); font-style: italic; }
.answer-hint { font-size: 0.8rem; color: var(--chalk-yellow); margin-top: 12px; display: none; }
.btn-row { display: flex; gap: 8px; }

@media (max-width: 600px) {
  .header { flex-wrap: wrap; gap: 10px; }
  .q-footer { flex-direction: column-reverse; align-items: stretch; }
  .btn-row { justify-content: space-between; }
}
</style>
</head>
<body class="board">
<div class="header">
  <div class="brand">
    <div class="brand-badge"></div>
    <div>
      <div class="brand-name">Aira</div>
      <div class="brand-sub">One question at a time</div>
    </div>
  </div>
  <div class="header-right">
    <div class="step-pill" id="stepPill">Question 1</div>
    <div class="nav-back" onclick="window.location.href='Welcome.html'">‹ Classroom</div>
  </div>
</div>

<div class="container">
  <div class="progress-area">
    <div class="progress-meta">
      <div class="progress-dots" id="progressDots"></div>
      <div class="progress-pct" id="progressPct">0% done</div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <h2 class="page-title chalk-title">Shape your AI coach.</h2>
  <p class="page-sub chalk-sub">These answers help Aira understand who you are — not just what you know. There are no right or wrong answers here. No marks cut.</p>

  <div id="questionArea"></div>
</div>

<script src="assets/dictation.js"></script>
<script>
const API_BASE = "";

// questions: full objects from the bank (with options, type, dimension, etc.)
// responses: Map of question id → saved answer object
let questions = [];
let responses = new Map();
let currentIndex = 0;

// 'warmup' → the unscored spoken opener; 'questions' → the persona set itself.
// The warm-up exists to get the first spoken rep out of the way somewhere it
// cannot be failed: nobody reached the speaking module on their own, and asking
// a nervous person to speak for the first time into a graded session is the
// hardest possible opening move. It is deliberately NOT a persona dimension, is
// never submitted, never writes to speaking_sessions and never touches the
// 2-a-day practice quota — it is a rehearsal, not a rep that counts.
let stage = 'warmup';
let dictation = null;
// /session/get-questions is a Groq call and is not instant. The warm-up runs
// while it's in flight, so the generation latency lands on a screen the user is
// busy with instead of on a spinner.
let questionsReady = false;
let loadError = null;

function showLoading() {
  document.getElementById('questionArea').innerHTML =
    '<div class="q-card board-card"><p style="color:var(--muted);">Getting your questions ready…</p></div>';
}

function showLoadError(msg) {
  document.getElementById('questionArea').innerHTML =
    `<div class="q-card board-card"><p style="color:var(--muted);">Could not load questions. Is the backend running?<br><small>${escHtml(msg)}</small></p></div>`;
}

// Free-text answers need real substance, not a single word, before Aira will read them.
const MIN_TEXT_CHARS = 15;

function currentAnswered() {
  const q = questions[currentIndex];
  if (isChoiceBased(q)) {
    return !!document.querySelector('.option-card.selected');
  }
  const ta = document.getElementById('answerInput');
  return !!ta && ta.value.trim().length >= MIN_TEXT_CHARS;
}

function updateNextState() {
  const btn = document.getElementById('nextBtn');
  const hint = document.getElementById('answerHint');
  if (!btn) return;
  const ok = currentAnswered();
  btn.disabled = !ok;
  if (hint) hint.style.display = ok ? 'none' : 'block';
}

window.addEventListener('load', async () => {
  // Auth is server-truth only (the 401 check below) — a localStorage guard here
  // once bounced every logged-in user to login, because nothing writes that key anymore.
  // Persona questions are built from the resume — onboarding must come first.
  try {
    const r = await fetch(`${API_BASE}/onboarding/status`, { credentials: 'include' });
    if (r.status === 401) { window.location.replace('login.html'); return; }
    if (r.ok) {
      const d = await r.json();
      if (!d.complete) { window.location.replace('onboarding.html'); return; }
    }
  } catch (e) {}

  // A Core Persona is generated once and locked — this page isn't a free "retake"
  // once one exists. It's only reachable again as a deliberate refresh, and only
  // once Aira has enough new session evidence (server is the source of truth here,
  // this is just closing off the wasted-effort path of retaking 10 questions that
  // would get rejected at the end anyway).
  try {
    const check = await fetch(`${API_BASE}/me/persona`, { credentials: 'include' });
    if (check.ok) {
      const d = await check.json();
      if (d.persona && d.persona.ready && !d.persona.canRefresh) {
        window.location.replace('Welcome.html');
        return;
      }
      // Refreshing an existing persona — this user has been here before and does
      // not need the warm-up again.
      if (d.persona && d.persona.ready) stage = 'questions';
    }
  } catch (e) {}

  document.body.classList.add('loaded');
  if (stage === 'warmup') refresh(); else showLoading();
  loadQuestions();
});

function renderDots() {
  const el = document.getElementById('progressDots');
  el.innerHTML = questions.map((_, i) => {
    const cls = i < currentIndex ? 'dot done' : i === currentIndex ? 'dot active' : 'dot';
    return `<div class="${cls}"></div>`;
  }).join('');
}

function updateProgress() {
  const total = questions.length || 1;
  const pct = Math.round(((currentIndex + 1) / total) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct + '% done';
  document.getElementById('stepPill').textContent = `Question ${currentIndex + 1} of ${total}`;
}

function isChoiceBased(q) {
  return q.options && q.options.length > 0;
}

function renderQuestion() {
  const area = document.getElementById('questionArea');
  if (!questions.length) { area.textContent = 'No questions available.'; return; }

  // Any live recogniser belongs to the question we're leaving, not this one.
  if (dictation) { dictation.stop(); dictation = null; }

  const q = questions[currentIndex];
  const saved = responses.get(q.id) || {};
  const isLast = currentIndex === questions.length - 1;

  let inputHtml;
  let textPlaceholder = '';
  if (isChoiceBased(q)) {
    const optionsHtml = q.options.map(opt => {
      const sel = saved.selected_label === opt.label ? ' selected' : '';
      return `<div class="option-card${sel}" data-label="${opt.label}" data-text="${escHtml(opt.text)}" data-signal="${escHtml(opt.signal || '')}">
        <div class="option-letter">${opt.label}</div>
        <div class="option-text">${escHtml(opt.text)}</div>
      </div>`;
    }).join('');
    inputHtml = `<div class="options-list" id="optionsList">${optionsHtml}</div>`;
  } else {
    const savedText = saved.answer || '';
    textPlaceholder = q.type === 'reflection'
      ? 'Write freely — this one is just for you.'
      : 'Write freely. Aira is listening, not judging.';
    // The free-text persona question is the "recall" one — "tell me about a time…"
    // — which is an interview answer in all but name, so speaking it is the natural
    // way to answer. The mic appears here and nowhere else: you cannot speak a
    // multiple-choice answer, and every other dimension is multiple choice.
    const speakHtml = (window.Dictation && window.Dictation.supported) ? `
      <div class="speak-row">
        <button class="mic-btn" id="answerMic" type="button"><span class="mic-dot"></span>Speak your answer</button>
        <span class="mic-status" id="answerMicStatus"></span>
        <span class="speak-note">or just type — same result either way</span>
      </div>` : '';
    inputHtml = speakHtml + `<textarea id="answerInput" placeholder="${textPlaceholder}">${escHtml(savedText)}</textarea>`;
  }

  const helperText = isChoiceBased(q)
    ? 'Pick the option that feels most true, not the one that sounds best.'
    : 'Tip: write like you\'re talking to a trusted friend.';

  area.innerHTML = `
    <div class="q-card board-card pin-yellow">
      <div class="q-meta">Persona setup · Question ${currentIndex + 1}</div>
      <div class="q-text">${escHtml(q.text)}</div>
      ${inputHtml}
      <div class="answer-hint" id="answerHint">${isChoiceBased(q) ? 'Pick the option that fits you best to continue.' : 'Write a little more so Aira can actually understand you.'}</div>
      <div class="q-footer">
        <div class="helper">${helperText}</div>
        <div class="btn-row">
          <button class="btn-chalk" id="prevBtn" ${currentIndex === 0 ? 'disabled' : ''}>‹ Previous</button>
          <button class="btn-chalk primary" id="nextBtn">${isLast ? 'Save & view persona' : 'Next ›'}</button>
        </div>
      </div>
    </div>
  `;

  // Wire up choice cards
  if (isChoiceBased(q)) {
    area.querySelectorAll('.option-card').forEach(card => {
      card.addEventListener('click', () => {
        area.querySelectorAll('.option-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        updateNextState();
      });
    });
  } else {
    const ta = document.getElementById('answerInput');
    ta.addEventListener('input', updateNextState);
    ta.focus();

    const mic = document.getElementById('answerMic');
    if (mic) {
      dictation = window.Dictation.attach({
        textarea: ta,
        micBtn: mic,
        statusEl: document.getElementById('answerMicStatus'),
        idlePlaceholder: textPlaceholder,
        livePlaceholder: 'Listening — the words appear as Aira hears them.',
        // Setting .value in script fires no 'input' event, so without this the
        // Next button stays disabled no matter how long the user talks.
        onChange: updateNextState,
      });
    }
  }

  updateNextState();

  document.getElementById('prevBtn').onclick = () => {
    captureAnswer();
    if (currentIndex > 0) { currentIndex--; refresh(); }
  };
  document.getElementById('nextBtn').onclick = async () => {
    captureAnswer();
    if (currentIndex < questions.length - 1) {
      currentIndex++;
      refresh();
    } else {
      const btn = document.getElementById('nextBtn');
      btn.disabled = true;
      btn.textContent = 'Saving…';
      try {
        await submitAnswers();
        window.location.href = 'persona.html?refresh=1';
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Save & view persona';
        const area = document.getElementById('questionArea');
        const notice = document.createElement('p');
        notice.style.cssText = 'color:#f2e2a0;font-size:0.84rem;margin-top:12px;';
        notice.textContent = 'Could not save your answers: ' + err.message + '. Make sure you are logged in and try again.';
        area.appendChild(notice);
      }
    }
  };
}

function captureAnswer() {
  const q = questions[currentIndex];
  if (isChoiceBased(q)) {
    const selected = document.querySelector('.option-card.selected');
    if (selected) {
      responses.set(q.id, {
        id: q.id,
        dimension: q.dimension,
        type: q.type,
        text: q.text,
        selected_label: selected.dataset.label,
        selected_text: selected.dataset.text,
        signal: selected.dataset.signal,
      });
    }
  } else {
    const el = document.getElementById('answerInput');
    if (el) {
      responses.set(q.id, {
        id: q.id,
        dimension: q.dimension,
        type: q.type,
        text: q.text,
        answer: el.value,
      });
    }
  }
}

function refresh() {
  const progressArea = document.querySelector('.progress-area');
  if (stage === 'warmup') {
    progressArea.style.display = 'none';
    document.getElementById('stepPill').textContent = 'Warm-up';
    renderWarmup();
    return;
  }
  progressArea.style.display = '';
  renderDots(); updateProgress(); renderQuestion();
}

function leaveWarmup() {
  if (dictation) { dictation.stop(); dictation = null; }
  stage = 'questions';
  document.querySelector('.page-title').textContent = 'Shape your AI coach.';
  document.querySelector('.page-sub').textContent =
    'These answers help Aira understand who you are — not just what you know. There are no right or wrong answers here. No marks cut.';
  // The pill still reads "Warm-up" at this point; refresh() only rewrites it once
  // there are questions to count, so clear it rather than leave a stale label on
  // the loading and error states.
  document.getElementById('stepPill').textContent = '';
  // Someone can finish the warm-up faster than Groq generates the set.
  if (loadError) { showLoadError(loadError); return; }
  if (!questionsReady) { showLoading(); return; }
  refresh();
}

// Deliberately skippable, and the skip is plain text rather than a buried link.
// A warm-up that traps someone is worse than no warm-up at all — the point is to
// lower the cost of the first sentence, not to add one more gate.
function renderWarmup() {
  document.querySelector('.page-title').textContent = 'First, just say hello.';
  document.querySelector('.page-sub').textContent =
    'One sentence to warm up your voice. Nothing here is recorded, scored, or saved — it does not count towards your daily practice.';

  const canSpeak = window.Dictation && window.Dictation.supported;
  document.getElementById('questionArea').innerHTML = `
    <div class="q-card board-card pin-yellow">
      <div class="warmup-tag">Warm-up · not scored</div>
      <div class="warmup-q">Say your name, and one thing you're working on.</div>
      <p class="warmup-sub">${canSpeak
        ? 'Tap the mic and talk. You will see the words appear as Aira hears them — if they come out wrong, that is the mic, not you.'
        : 'This browser does not support the mic, so type it instead. Everything after this works exactly the same.'}</p>
      ${canSpeak ? `
      <div class="speak-row">
        <button class="mic-btn" id="warmupMic" type="button"><span class="mic-dot"></span>Tap to speak</button>
        <span class="mic-status" id="warmupMicStatus"></span>
      </div>` : ''}
      <textarea id="warmupInput" placeholder="Hi, I'm — and I'm working on —"></textarea>
      <div class="q-footer">
        <button class="skip-link" id="warmupSkip" type="button">Skip the warm-up</button>
        <div class="btn-row">
          <button class="btn-chalk primary" id="warmupNext">I'm ready ›</button>
        </div>
      </div>
    </div>`;

  if (canSpeak) {
    dictation = window.Dictation.attach({
      textarea: document.getElementById('warmupInput'),
      micBtn: document.getElementById('warmupMic'),
      statusEl: document.getElementById('warmupMicStatus'),
      maxChars: 400,
      idlePlaceholder: "Hi, I'm — and I'm working on —",
      livePlaceholder: 'Listening — say it how you would out loud.',
    });
  }

  document.getElementById('warmupSkip').onclick = leaveWarmup;
  document.getElementById('warmupNext').onclick = leaveWarmup;
}

async function loadQuestions() {
  try {
    const res = await fetch(`${API_BASE}/session/get-questions`);
    if (!res.ok) throw new Error('Failed to load');
    const data = await res.json();
    questions = data.questions || [];
    questionsReady = true;
    // Never repaint over a warm-up in progress — the user is mid-sentence.
    if (stage === 'questions') refresh();
  } catch (err) {
    loadError = err.message;
    if (stage === 'questions') showLoadError(err.message);
  }
}

async function submitAnswers() {
  const payload = questions.map(q => responses.get(q.id) || {
    id: q.id, dimension: q.dimension, type: q.type, text: q.text,
  });
  const res = await fetch(`${API_BASE}/session/save-answers`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ responses: payload }),
    credentials: 'include',
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.message || `Server error ${res.status}`);
  }
}

function escHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
</script>
<script src="assets/brand.js"></script>
<script src="assets/guide.js"></script>
</body>
</html>
