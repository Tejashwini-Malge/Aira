<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aira · Questions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schoolbell&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/chalkboard.css">
<style>
* { margin: 0; padding: 0; }
body.board {
  display: flex; flex-direction: column;
  align-items: center; padding: 24px 16px 40px;
  opacity: 0; transition: opacity 0.5s ease;
}
body.loaded { opacity: 1; }

.header {
  max-width: 680px; width: 100%; display: flex;
  align-items: center; justify-content: space-between; margin-bottom: 36px; position: relative; z-index: 1;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-badge {
  width: 32px; height: 32px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff, var(--chalk) 60%, #cfc9b0 100%);
  display: flex; align-items: center; justify-content: center;
  color: var(--board-dark); font-weight: 700; font-family: var(--fd); font-size: 1rem;
}
.brand-name { font-family: var(--fd); font-size: 1.05rem; color: var(--chalk); }
.brand-sub { font-size: 0.72rem; color: var(--muted); }
.header-right { display: flex; align-items: center; gap: 8px; }
.step-pill { padding: 5px 12px; border-radius: 999px; border: 1.5px dashed rgba(242,226,160,0.4); font-size: 0.76rem; color: var(--chalk-yellow); }
.nav-back {
  font-size: 0.78rem; color: var(--muted); cursor: pointer;
  padding: 5px 12px; border-radius: 999px; border: 1.5px dashed var(--dash);
  transition: all 0.2s;
}
.nav-back:hover { color: var(--chalk); border-color: var(--chalk); }

.container { max-width: 680px; width: 100%; position: relative; z-index: 1; }

.progress-area { margin-bottom: 28px; }
.progress-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.progress-dots { display: flex; gap: 6px; }
.dot {
  width: 9px; height: 9px; border-radius: 50%;
  border: 1.5px dashed var(--dash); background: transparent;
  transition: all 0.3s ease;
}
.dot.done { background: rgba(244,241,228,0.5); border-style: solid; border-color: rgba(244,241,228,0.5); }
.dot.active { background: var(--chalk-yellow); border-style: solid; border-color: var(--chalk-yellow); transform: scale(1.15); }
.progress-pct { font-size: 0.76rem; color: var(--muted); }
.progress-track { height: 5px; border-radius: 999px; background: rgba(244,241,228,0.08); overflow: hidden; border: 1px dashed var(--dash); }
.progress-fill { height: 100%; width: 0; border-radius: 999px; background: repeating-linear-gradient(90deg, var(--chalk) 0 5px, transparent 5px 8px); transition: width 0.4s ease-out; }

.page-title { font-family: var(--fd); font-size: 1.7rem; color: var(--chalk); margin-bottom: 5px; text-shadow: 0 0 1px rgba(255,255,255,0.5); }
.page-sub { font-size: 0.88rem; color: var(--muted); margin-bottom: 22px; line-height: 1.55; }

.q-card { padding: 24px 22px; animation: fadeUp 0.4s ease forwards; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.q-meta { font-size: 0.72rem; color: var(--chalk-yellow); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 12px; opacity: 0.85; }
.q-text { font-family: var(--fd); font-size: 1.25rem; line-height: 1.55; color: var(--chalk); margin-bottom: 18px; }

/* Choice options — like options chalked on the board */
.options-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.option-card {
  padding: 12px 14px; border-radius: 8px;
  border: 1.5px dashed var(--dash);
  cursor: pointer; transition: all 0.18s ease;
  display: flex; align-items: flex-start; gap: 10px;
}
.option-card:hover { border-color: var(--chalk); background: rgba(244,241,228,0.05); }
.option-card.selected {
  border-color: var(--chalk-yellow); border-style: solid;
  background: rgba(242,226,160,0.07);
}
.option-letter {
  min-width: 24px; height: 24px; border-radius: 50%;
  border: 1.5px dashed var(--dash); display: flex; align-items: center;
  justify-content: center; font-size: 0.76rem; font-weight: 700;
  color: var(--muted); flex-shrink: 0; margin-top: 1px;
  transition: all 0.18s ease;
}
.option-card.selected .option-letter {
  background: var(--chalk-yellow); border-color: var(--chalk-yellow); border-style: solid; color: var(--board-dark);
}
.option-text { font-size: 0.9rem; color: var(--muted); line-height: 1.55; transition: color 0.18s; }
.option-card.selected .option-text { color: var(--chalk); }

/* Text input — write on the slate */
textarea {
  width: 100%; min-height: 100px; padding: 12px 14px;
  border-radius: 8px; border: 1.5px dashed var(--dash);
  background: rgba(244,241,228,0.04); color: var(--chalk);
  font-size: 0.92rem; font-family: var(--fb); resize: vertical;
  transition: all 0.2s ease; line-height: 1.6;
}
textarea::placeholder { color: rgba(244,241,228,0.3); }
textarea:focus { outline: none; border-color: var(--chalk-yellow); border-style: solid; background: rgba(244,241,228,0.07); }

.q-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; flex-wrap: wrap; gap: 10px; }
.helper { font-size: 0.78rem; color: var(--muted); font-style: italic; }
.answer-hint { font-size: 0.78rem; color: var(--chalk-yellow); margin-top: 12px; display: none; }
.btn-row { display: flex; gap: 8px; }

@media (max-width: 600px) {
  .header { flex-wrap: wrap; gap: 10px; }
  .q-footer { flex-direction: column-reverse; align-items: stretch; }
  .btn-row { justify-content: space-between; }
}
</style>
</head>
<body class="board">
<div class="header">
  <div class="brand">
    <div class="brand-badge">A</div>
    <div>
      <div class="brand-name">Aira</div>
      <div class="brand-sub">One question at a time</div>
    </div>
  </div>
  <div class="header-right">
    <div class="step-pill" id="stepPill">Question 1</div>
    <div class="nav-back" onclick="window.location.href='Welcome.html'">‹ Classroom</div>
  </div>
</div>

<div class="container">
  <div class="progress-area">
    <div class="progress-meta">
      <div class="progress-dots" id="progressDots"></div>
      <div class="progress-pct" id="progressPct">0% done</div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <h2 class="page-title chalk-title">Shape your AI coach.</h2>
  <p class="page-sub chalk-sub">These answers help Aira understand who you are — not just what you know. There are no right or wrong answers here. No marks cut.</p>

  <div id="questionArea"></div>
</div>

<script>
const API_BASE = "";

// questions: full objects from the bank (with options, type, dimension, etc.)
// responses: Map of question id → saved answer object
let questions = [];
let responses = new Map();
let currentIndex = 0;

// Free-text answers need real substance, not a single word, before Aira will read them.
const MIN_TEXT_CHARS = 15;

function currentAnswered() {
  const q = questions[currentIndex];
  if (isChoiceBased(q)) {
    return !!document.querySelector('.option-card.selected');
  }
  const ta = document.getElementById('answerInput');
  return !!ta && ta.value.trim().length >= MIN_TEXT_CHARS;
}

function updateNextState() {
  const btn = document.getElementById('nextBtn');
  const hint = document.getElementById('answerHint');
  if (!btn) return;
  const ok = currentAnswered();
  btn.disabled = !ok;
  if (hint) hint.style.display = ok ? 'none' : 'block';
}

window.addEventListener('load', async () => {
  // Auth is server-truth only (the 401 check below) — a localStorage guard here
  // once bounced every logged-in user to login, because nothing writes that key anymore.
  // Persona questions are built from the resume — onboarding must come first.
  try {
    const r = await fetch(`${API_BASE}/onboarding/status`, { credentials: 'include' });
    if (r.status === 401) { window.location.replace('login.html'); return; }
    if (r.ok) {
      const d = await r.json();
      if (!d.complete) { window.location.replace('onboarding.html'); return; }
    }
  } catch (e) {}
  document.body.classList.add('loaded');
  loadQuestions();
});

function renderDots() {
  const el = document.getElementById('progressDots');
  el.innerHTML = questions.map((_, i) => {
    const cls = i < currentIndex ? 'dot done' : i === currentIndex ? 'dot active' : 'dot';
    return `<div class="${cls}"></div>`;
  }).join('');
}

function updateProgress() {
  const total = questions.length || 1;
  const pct = Math.round(((currentIndex + 1) / total) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct + '% done';
  document.getElementById('stepPill').textContent = `Question ${currentIndex + 1} of ${total}`;
}

function isChoiceBased(q) {
  return q.options && q.options.length > 0;
}

function renderQuestion() {
  const area = document.getElementById('questionArea');
  if (!questions.length) { area.textContent = 'No questions available.'; return; }

  const q = questions[currentIndex];
  const saved = responses.get(q.id) || {};
  const isLast = currentIndex === questions.length - 1;

  let inputHtml;
  if (isChoiceBased(q)) {
    const optionsHtml = q.options.map(opt => {
      const sel = saved.selected_label === opt.label ? ' selected' : '';
      return `<div class="option-card${sel}" data-label="${opt.label}" data-text="${escHtml(opt.text)}" data-signal="${escHtml(opt.signal || '')}">
        <div class="option-letter">${opt.label}</div>
        <div class="option-text">${escHtml(opt.text)}</div>
      </div>`;
    }).join('');
    inputHtml = `<div class="options-list" id="optionsList">${optionsHtml}</div>`;
  } else {
    const savedText = saved.answer || '';
    const ph = q.type === 'reflection'
      ? 'Write freely — this one is just for you.'
      : 'Write freely. Aira is listening, not judging.';
    inputHtml = `<textarea id="answerInput" placeholder="${ph}">${escHtml(savedText)}</textarea>`;
  }

  const helperText = isChoiceBased(q)
    ? 'Pick the option that feels most true, not the one that sounds best.'
    : 'Tip: write like you\'re talking to a trusted friend.';

  area.innerHTML = `
    <div class="q-card board-card pin-yellow">
      <div class="q-meta">Persona setup · Question ${currentIndex + 1}</div>
      <div class="q-text">${escHtml(q.text)}</div>
      ${inputHtml}
      <div class="q-footer">
        <div class="helper">${helperText}</div>
        <div class="btn-row">
          <button class="btn-chalk" id="prevBtn" ${currentIndex === 0 ? 'disabled' : ''}>‹ Previous</button>
          <button class="btn-chalk primary" id="nextBtn">${isLast ? 'Save & view persona' : 'Next ›'}</button>
        </div>
      </div>
      <div class="answer-hint" id="answerHint">${isChoiceBased(q) ? 'Pick the option that fits you best to continue.' : 'Write a little more so Aira can actually understand you.'}</div>
    </div>
  `;

  // Wire up choice cards
  if (isChoiceBased(q)) {
    area.querySelectorAll('.option-card').forEach(card => {
      card.addEventListener('click', () => {
        area.querySelectorAll('.option-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        updateNextState();
      });
    });
  } else {
    const ta = document.getElementById('answerInput');
    ta.addEventListener('input', updateNextState);
    ta.focus();
  }

  updateNextState();

  document.getElementById('prevBtn').onclick = () => {
    captureAnswer();
    if (currentIndex > 0) { currentIndex--; refresh(); }
  };
  document.getElementById('nextBtn').onclick = async () => {
    captureAnswer();
    if (currentIndex < questions.length - 1) {
      currentIndex++;
      refresh();
    } else {
      const btn = document.getElementById('nextBtn');
      btn.disabled = true;
      btn.textContent = 'Saving…';
      try {
        await submitAnswers();
        window.location.href = 'persona.html';
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Save & view persona';
        const area = document.getElementById('questionArea');
        const notice = document.createElement('p');
        notice.style.cssText = 'color:#f2e2a0;font-size:0.84rem;margin-top:12px;';
        notice.textContent = 'Could not save your answers: ' + err.message + '. Make sure you are logged in and try again.';
        area.appendChild(notice);
      }
    }
  };
}

function captureAnswer() {
  const q = questions[currentIndex];
  if (isChoiceBased(q)) {
    const selected = document.querySelector('.option-card.selected');
    if (selected) {
      responses.set(q.id, {
        id: q.id,
        dimension: q.dimension,
        type: q.type,
        text: q.text,
        selected_label: selected.dataset.label,
        selected_text: selected.dataset.text,
        signal: selected.dataset.signal,
      });
    }
  } else {
    const el = document.getElementById('answerInput');
    if (el) {
      responses.set(q.id, {
        id: q.id,
        dimension: q.dimension,
        type: q.type,
        text: q.text,
        answer: el.value,
      });
    }
  }
}

function refresh() { renderDots(); updateProgress(); renderQuestion(); }

async function loadQuestions() {
  try {
    const res = await fetch(`${API_BASE}/session/get-questions`);
    if (!res.ok) throw new Error('Failed to load');
    const data = await res.json();
    questions = data.questions || [];
    refresh();
  } catch (err) {
    document.getElementById('questionArea').innerHTML =
      `<div class="q-card board-card"><p style="color:var(--muted);">Could not load questions. Is the backend running?<br><small>${err.message}</small></p></div>`;
  }
}

async function submitAnswers() {
  const payload = questions.map(q => responses.get(q.id) || {
    id: q.id, dimension: q.dimension, type: q.type, text: q.text,
  });
  const res = await fetch(`${API_BASE}/session/save-answers`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ responses: payload }),
    credentials: 'include',
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.message || `Server error ${res.status}`);
  }
}

function escHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
</script>
</body>
</html>
