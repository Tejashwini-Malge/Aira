<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="assets/aira-mark.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aira · Enrol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schoolbell&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/chalkboard.css">
<style>
* { margin: 0; padding: 0; }
html, body { height: 100%; }
body.board { display: flex; flex-direction: column; }
.page { flex: 1; display: flex; justify-content: center; padding: 32px 24px; position: relative; z-index: 1; overflow-y: auto; }

/* ── the admission panel — clean, grounded & secure ── */
.auth-card {
  position: relative; z-index: 2; margin: auto;
  width: 100%; max-width: 440px;
  padding: 32px 32px 26px;
  background: rgba(16,32,24,0.55);
  border: 1px solid rgba(244,241,228,0.1);
  border-radius: 18px;
  box-shadow: 0 24px 56px rgba(0,0,0,0.32);
}

.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; text-decoration: none; }
.brand-badge {
  width: 34px; height: 34px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff, var(--chalk) 60%, #cfc9b0 100%);
  display: flex; align-items: center; justify-content: center;
  color: var(--board-dark); font-weight: 700; font-family: var(--fd); font-size: 1.05rem;
}
.brand-name { font-family: var(--fd); font-size: 1.15rem; color: var(--chalk); }
.brand-sub { font-size: 0.8rem; color: var(--muted); }

.form-heading { font-size: 2rem; margin-bottom: 6px; line-height: 1.2; }
.form-sub { font-size: 0.92rem; color: var(--muted); margin-bottom: 24px; line-height: 1.6; }

form { display: flex; flex-direction: column; gap: 13px; margin-bottom: 20px; }
.field-group { display: flex; flex-direction: column; gap: 5px; }
label { font-size: 0.85rem; color: var(--chalk-dim); }
input {
  padding: 12px 14px; border-radius: 9px; border: 1.5px solid rgba(244,241,228,0.2);
  background: rgba(244,241,228,0.05); color: var(--chalk);
  font-size: 0.95rem; font-family: var(--fb); transition: all 0.2s ease; width: 100%;
}
input::placeholder { color: rgba(244,241,228,0.35); }
input:focus {
  outline: none; border-color: var(--chalk-yellow);
  background: rgba(244,241,228,0.08); box-shadow: 0 0 0 3px rgba(242,226,160,0.14);
}

/* ── solid & secure buttons — matched to the landing page ── */
.btn-chalk {
  border: 1.5px solid rgba(244,241,228,0.3); border-radius: 10px;
  background: rgba(244,241,228,0.06); box-shadow: 0 2px 8px rgba(0,0,0,0.14);
}
.btn-chalk:hover { background: rgba(244,241,228,0.12); border-color: var(--chalk); border-style: solid; transform: translateY(-2px); }
.btn-chalk.primary {
  color: var(--board-dark);
  background: linear-gradient(180deg, #f8efc6, var(--chalk-yellow));
  border: 1.5px solid #e6d488; box-shadow: 0 6px 18px rgba(242,226,160,0.28); text-shadow: none;
}
.btn-chalk.primary:hover { background: linear-gradient(180deg, #fbf4d4, #f5e4a6); box-shadow: 0 9px 24px rgba(242,226,160,0.36); }

.microcopy { font-size: 0.85rem; color: var(--muted); text-align: center; margin-top: 14px; min-height: 1.3em; }
.already-have { margin-top: 16px; text-align: center; font-size: 0.88rem; color: var(--muted); }
.already-have a { color: var(--chalk-yellow); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
</style>
</head>
<body class="board">
<div class="page">

  <section class="auth-card">
    <a class="brand" href="index.html">
      <div class="brand-badge"></div>
      <div>
        <div class="brand-name">Aira</div>
        <div class="brand-sub">Never lose yourself in the moment that matters</div>
      </div>
    </a>

    <h2 class="chalk-title form-heading">Enrol yourself.</h2>
    <p class="form-sub chalk-sub">One admission form — then your persona, practice sessions, and report card are ready and waiting.</p>

    <form id="signupForm">
      <div class="field-group">
        <label for="name">Name · what should Aira call you?</label>
        <input type="text" id="name" placeholder="e.g. Ananya, Aditya…" required>
      </div>
      <div class="field-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="field-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a strong password" required>
      </div>
      <div class="field-group">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" placeholder="Re-type your password" required>
      </div>
    </form>

    <button class="btn-chalk primary" style="width:100%;font-size:1.15rem" onclick="handleSignup()">
      Take admission →
    </button>

    <p class="microcopy" id="microcopy"></p>
    <p class="already-have">Already enrolled? <a onclick="window.location.href='login.html'">Log in</a></p>
  </section>
</div>

<script>
const micEl = document.getElementById('microcopy');

async function handleSignup() {
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const pwd = document.getElementById('password').value;
  const cpwd = document.getElementById('confirmPassword').value;

  if (!name || !email || !pwd || !cpwd) {
    micEl.style.color = '#eaacb8';
    micEl.textContent = 'Please fill in all fields.';
    return;
  }
  if (pwd !== cpwd) {
    micEl.style.color = '#eaacb8';
    micEl.textContent = "Passwords don't match. Quick fix.";
    return;
  }

  micEl.style.color = '#f2e2a0';
  micEl.textContent = 'Creating your account…';

  try {
    const res = await fetch('/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password: pwd }),
      credentials: 'include'
    });
    const data = await res.json();
    if (res.ok && data.success) {
      micEl.textContent = 'Admission granted! Taking you to login…';
      setTimeout(() => { window.location.href = 'login.html'; }, 900);
    } else {
      micEl.style.color = '#eaacb8';
      micEl.textContent = data.message || 'Something went wrong. Try again.';
    }
  } catch (e) {
    micEl.style.color = '#eaacb8';
    micEl.textContent = 'Could not reach the server. Is it running?';
  }
}
document.getElementById('signupForm').addEventListener('submit', e => { e.preventDefault(); handleSignup(); });
</script>
<script src="assets/brand.js"></script>
</body>
</html>
