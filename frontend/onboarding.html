<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aira · Getting to know you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0C0A07;
  --card: rgba(255,244,224,0.04);
  --border: rgba(202,156,77,0.18);
  --border-bright: rgba(202,156,77,0.38);
  --gold: #C9A46E;
  --gold-light: #E8C97A;
  --cream: #F2E8D8;
  --muted: #9B8E7E;
  --r: 16px;
  --fd: 'Playfair Display', Georgia, serif;
  --fb: 'Inter', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--fb); background: var(--bg); color: var(--cream);
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; padding: 24px 16px 48px;
  opacity: 0; transition: opacity 0.5s ease;
}
body.loaded { opacity: 1; }
body::before {
  content: ''; position: fixed; top: 0; left: 0; right: 0; height: 320px;
  background: radial-gradient(ellipse at top, rgba(196,149,58,0.08) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}
.header {
  max-width: 640px; width: 100%; display: flex; align-items: center;
  gap: 10px; margin-bottom: 26px; position: relative; z-index: 1;
}
.brand-badge {
  width: 34px; height: 34px; border-radius: 50%;
  background: radial-gradient(circle at 30% 20%, #F2E8D8 0%, #C9A46E 55%, #8B6520 100%);
  display: flex; align-items: center; justify-content: center;
  color: #0C0A07; font-weight: 700; font-size: 0.9rem;
  box-shadow: 0 0 16px rgba(201,164,110,0.3);
}
.brand-name { font-family: var(--fd); font-size: 1rem; font-weight: 600; }
.brand-sub { font-size: 0.7rem; color: var(--muted); }

.container { max-width: 640px; width: 100%; position: relative; z-index: 1; }

.intro { margin-bottom: 26px; }
.intro .greeting { font-size: 0.72rem; color: var(--gold); text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 10px; }
.intro h1 { font-family: var(--fd); font-size: 1.6rem; line-height: 1.35; color: var(--cream); margin-bottom: 10px; }
.intro p { font-size: 0.88rem; color: var(--muted); line-height: 1.6; }

.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r); padding: 26px 24px;
  animation: fadeUp 0.4s ease forwards;
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

.field { margin-bottom: 20px; }
.field label { display: block; font-size: 0.8rem; color: var(--cream); margin-bottom: 7px; font-weight: 500; }
.field .hint { font-size: 0.74rem; color: var(--muted); font-style: italic; margin-top: 5px; }
.req { color: var(--gold); }

input[type="text"], select, textarea {
  width: 100%; padding: 11px 13px; border-radius: 10px;
  border: 1px solid var(--border); background: rgba(255,244,224,0.03);
  color: var(--cream); font-size: 0.88rem; font-family: var(--fb);
  transition: all 0.2s ease;
}
textarea { min-height: 80px; resize: vertical; line-height: 1.6; }
input::placeholder, textarea::placeholder { color: rgba(155,142,126,0.5); }
input:focus, select:focus, textarea:focus {
  outline: none; border-color: rgba(201,164,110,0.45);
  background: rgba(255,244,224,0.05); box-shadow: 0 0 0 3px rgba(201,164,110,0.08);
}
select option { background: #14110B; color: var(--cream); }

/* Resume drop / file field */
.file-field {
  border: 1px dashed var(--border-bright); border-radius: 12px;
  padding: 18px 16px; text-align: center; cursor: pointer;
  background: rgba(255,244,224,0.02); transition: all 0.2s ease;
}
.file-field:hover { background: rgba(255,244,224,0.04); border-color: var(--gold); }
.file-field .fi-icon { font-size: 1.3rem; }
.file-field .fi-main { font-size: 0.85rem; color: var(--cream); margin: 6px 0 3px; }
.file-field .fi-sub { font-size: 0.74rem; color: var(--muted); }
.file-field.has-file { border-style: solid; border-color: var(--gold); }
.file-field.has-file .fi-main { color: var(--gold-light); }
input[type="file"] { display: none; }

.row { display: flex; gap: 14px; }
.row .field { flex: 1; }

.actions { margin-top: 8px; display: flex; flex-direction: column; gap: 12px; }
.btn-primary {
  width: 100%; padding: 13px; border-radius: 10px; border: none;
  background: linear-gradient(90deg, #C9A46E, #E8C97A); color: #0C0A07;
  font-size: 0.92rem; font-weight: 600; font-family: var(--fb); cursor: pointer;
  transition: all 0.2s ease;
}
.btn-primary:hover:not(:disabled) { filter: brightness(1.06); transform: translateY(-1px); }
.btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
.notice { font-size: 0.82rem; text-align: center; min-height: 18px; }

@media (max-width: 520px) { .row { flex-direction: column; gap: 0; } }
</style>
</head>
<body>
  <div class="header">
    <div class="brand-badge">A</div>
    <div>
      <div class="brand-name">Aira</div>
      <div class="brand-sub">Your career companion</div>
    </div>
  </div>

  <div class="container">
    <div class="intro">
      <div class="greeting" id="greeting">Hi there</div>
      <h1>Before we begin — tell me a little about you.</h1>
      <p>This is how I tune everything that comes next: your mock interviews, your practice, your feedback. A minute now, and the whole journey fits you better.</p>
    </div>

    <form class="card" id="onboardingForm">
      <div class="field">
        <label>What are you studying? <span class="req">*</span></label>
        <input type="text" name="study" id="study" placeholder="e.g. B.Tech Computer Science, 3rd year" required>
      </div>

      <div class="field">
        <label>What brings you to Aira? <span class="req">*</span></label>
        <select name="goal" id="goal" required>
          <option value="" disabled selected>Choose what fits best…</option>
          <option value="Placement / job preparation">Preparing for placements / a job</option>
          <option value="Building confidence">Building my confidence</option>
          <option value="Improving communication">Improving how I communicate</option>
          <option value="Interview or exam coming up">An interview or exam is coming up</option>
          <option value="Just exploring">Just exploring for now</option>
        </select>
      </div>

      <div class="row">
        <div class="field">
          <label>Where are you headed? <span class="req">*</span></label>
          <input type="text" name="target_role" id="target_role" placeholder="e.g. Backend developer — or 'not sure yet'" required>
        </div>
        <div class="field">
          <label>Industry / domain</label>
          <input type="text" name="target_industry" placeholder="e.g. fintech, edtech (optional)">
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>Any timeline?</label>
          <select name="timeline">
            <option value="" selected>No rush</option>
            <option value="Within a month">Within a month</option>
            <option value="In a few months">In a few months</option>
            <option value="Sometime this year">Sometime this year</option>
          </select>
        </div>
        <div class="field">
          <label>Language you're most comfortable in</label>
          <input type="text" name="language" placeholder="e.g. English, Hindi (optional)">
        </div>
      </div>

      <div class="field">
        <label>Your resume <span class="req">*</span></label>
        <label class="file-field" id="fileField" for="resume">
          <div class="fi-icon">📄</div>
          <div class="fi-main" id="fileMain">Click to upload your resume</div>
          <div class="fi-sub" id="fileSub">PDF or DOCX — this helps me understand your real experience</div>
        </label>
        <input type="file" name="resume" id="resume" accept=".pdf,.docx" required>
      </div>

      <div class="field">
        <label>Anything else you'd like me to know?</label>
        <textarea name="note" placeholder="Optional — a line about what you're working on, or what you struggle with."></textarea>
      </div>

      <div class="actions">
        <button type="submit" class="btn-primary" id="submitBtn">Continue →</button>
        <div class="notice" id="notice"></div>
      </div>
    </form>
  </div>

<script>
const API_BASE = '';

window.addEventListener('DOMContentLoaded', async () => {
  document.body.classList.add('loaded');
  // Personalise greeting and skip onboarding if it's already done.
  try {
    const cached = JSON.parse(localStorage.getItem('aira_user') || '{}');
    if (cached.name) document.getElementById('greeting').textContent = 'Hi ' + cached.name.split(' ')[0];
  } catch (e) {}
  try {
    const r = await fetch(`${API_BASE}/onboarding/status`, { credentials: 'include' });
    if (r.ok) {
      const d = await r.json();
      if (d.complete) { window.location.href = 'questions.html'; return; }
    } else if (r.status === 401) {
      window.location.href = 'login.html'; return;
    }
  } catch (e) {}
});

const fileInput = document.getElementById('resume');
fileInput.addEventListener('change', () => {
  const field = document.getElementById('fileField');
  if (fileInput.files.length) {
    field.classList.add('has-file');
    document.getElementById('fileMain').textContent = fileInput.files[0].name;
    document.getElementById('fileSub').textContent = 'Looks good — click to choose a different file';
  }
});

document.getElementById('onboardingForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const notice = document.getElementById('notice');

  if (!fileInput.files.length) {
    notice.style.color = '#C17B5A';
    notice.textContent = 'Please upload your resume to continue.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Reading your resume…';
  notice.style.color = 'var(--gold)';
  notice.textContent = 'Give me a moment — I\'m getting to know you.';

  try {
    const formData = new FormData(document.getElementById('onboardingForm'));
    const res = await fetch(`${API_BASE}/onboarding/save`, {
      method: 'POST',
      body: formData,
      credentials: 'include',
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok && data.success) {
      notice.style.color = 'var(--gold)';
      notice.textContent = 'Got it. Let\'s begin.';
      setTimeout(() => { window.location.href = 'questions.html'; }, 700);
    } else {
      btn.disabled = false;
      btn.textContent = 'Continue →';
      notice.style.color = '#C17B5A';
      notice.textContent = data.message || 'Something went wrong. Please try again.';
    }
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Continue →';
    notice.style.color = '#C17B5A';
    notice.textContent = 'Could not reach the server. Is it running?';
  }
});
</script>
</body>
</html>
