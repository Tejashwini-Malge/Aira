<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="assets/aira-mark.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aira · Framework</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schoolbell&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/chalkboard.css">
<style>
* { margin: 0; padding: 0; }

.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 40px; border-bottom: 2px dashed var(--dash);
  background: rgba(18,38,28,0.95); backdrop-filter: blur(10px);
  position: sticky; top: 0; z-index: 10;
}
.header-left { display: flex; align-items: center; gap: 14px; }
.back-btn { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--muted); cursor: pointer; border: 1.5px dashed var(--dash); background: none; font-family: var(--fb); padding: 5px 12px; border-radius: 8px; transition: all 0.2s; }
.back-btn:hover { color: var(--chalk); border-color: var(--chalk); }
.brand { display: flex; align-items: center; gap: 8px; }
.brand-badge { width: 28px; height: 28px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, var(--chalk) 60%, #cfc9b0 100%); display: flex; align-items: center; justify-content: center; color: var(--board-dark); font-weight: 700; font-family: var(--fd); font-size: 0.9rem; }
.brand-name { font-family: var(--fd); font-size: 0.95rem; color: var(--chalk); }
.module-badge { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--chalk-yellow); border: 1.5px dashed rgba(242,226,160,0.4); padding: 3px 10px; border-radius: 999px; }

.main { max-width: 680px; margin: 0 auto; padding: 44px 40px 80px; position: relative; z-index: 1; }

.hero { margin-bottom: 28px; }
.hero-title { font-size: 1.9rem; line-height: 1.3; margin: 10px 0 6px; }
.hero-sub { font-size: 0.9rem; color: var(--muted); line-height: 1.7; }

.teach-panel { padding: 26px 26px; }
.teach-loading { color: var(--muted); font-style: italic; font-size: 0.88rem; }
.fw-name { font-family: var(--fd); font-size: 1.35rem; color: var(--chalk-yellow); margin-bottom: 6px; }
.fw-why { font-size: 0.9rem; color: var(--chalk-dim); line-height: 1.7; margin-bottom: 18px; }
.fw-steps { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.fw-step { font-size: 0.82rem; color: var(--chalk); border: 1.5px dashed var(--dash); border-radius: 999px; padding: 6px 13px; }
.fw-step span { color: var(--muted); }
.fw-example-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--chalk-yellow); margin-bottom: 8px; opacity: 0.85; }
.fw-example { font-size: 0.92rem; color: var(--chalk); line-height: 1.75; font-style: italic; border-left: 3px solid rgba(242,226,160,0.5); padding-left: 15px; }

.cta-block {
  margin-top: 24px; padding: 24px 26px; border-radius: 12px;
  border: 2px solid rgba(242,226,160,0.4);
  background: rgba(242,226,160,0.03);
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
  flex-wrap: wrap;
}
.cta-text .cta-title { font-family: var(--fd); font-size: 1.15rem; color: var(--chalk); margin-bottom: 4px; }
.cta-text .cta-sub { font-size: 0.82rem; color: var(--muted); }

@media (max-width: 720px) {
  .main { padding: 28px 16px 60px; }
  .header { padding: 12px 16px; }
  .cta-block { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body class="board">

<header class="header">
  <div class="header-left">
    <button class="back-btn" id="backBtn" onclick="window.location.href='soft_skills.html'">&#8592; Soft skills</button>
    <div class="brand">
      <div class="brand-badge"></div>
      <div class="brand-name">Aira</div>
    </div>
  </div>
  <div class="module-badge">Framework</div>
</header>

<div class="main">
  <div class="hero">
    <div class="chalk-tag">Learn before you practice</div>
    <h1 class="chalk-title hero-title" id="trackTitle">Loading…</h1>
    <p class="hero-sub chalk-sub" id="trackDesc"></p>
  </div>

  <div class="teach-panel board-card" id="teachPanel">
    <div class="teach-loading">Aira is preparing your framework and a model example…</div>
  </div>

  <div class="cta-block" id="ctaBlock" style="display:none;">
    <div class="cta-text">
      <div class="cta-title">Know it? Go practice.</div>
      <div class="cta-sub">Questions adapt to how you answer no need to memorize this word for word.</div>
    </div>
    <button class="btn-chalk primary" style="font-size:1.1rem" id="startBtn">Start speaking practice &#8594;</button>
  </div>
</div>

<script src="assets/aira.js"></script>
<script>

const TRACK_META = {
  communication: { icon: "\u{1F4AC}", label: "Communication practice" },
  intro:         { icon: "\u{1F3A4}", label: "Self-introduction" },
  project:       { icon: "\u{25B2}",  label: "Talk about your project" },
  voice:         { icon: "\u{1F3B5}", label: "Voice module" },
  leadership:    { icon: "\u{1F9ED}", label: "Leadership stories" },
  technical:     { icon: "\u{1F527}", label: "Technical communication" },
};

function escHtml(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

const params = new URLSearchParams(window.location.search);
const track = (params.get('track') || 'communication').toLowerCase();

(function() {
  const meta = TRACK_META[track] || TRACK_META.communication;
  document.getElementById('trackTitle').textContent = meta.icon + ' ' + meta.label;
  document.getElementById('backBtn').onclick = () => { window.location.href = 'soft_skills.html'; };
})();

async function loadFramework() {
  const panel = document.getElementById('teachPanel');
  try {
    const res = await fetch('/comm/setup?track=' + encodeURIComponent(track), { credentials: 'include' });
    if (res.status === 401) { window.location.replace('login.html'); return; }
    const d = await res.json();
    if (res.status === 403) {
      panel.innerHTML = '<div class="fw-name">&#128274; This one\'s locked</div>' +
        '<div class="fw-why" style="margin-bottom:0;">' + escHtml(d.error || 'This track is locked.') + '</div>';
      return;
    }
    if (!res.ok || !d.framework) throw new Error(d.error || 'Could not load this framework.');

    document.getElementById('trackDesc').textContent = 'The skill: ' + d.framework.name;
    panel.innerHTML =
      '<div class="fw-name">' + escHtml(d.framework.name) + '</div>' +
      '<div class="fw-why">' + escHtml(d.framework.why) + '</div>' +
      '<div class="fw-steps">' +
      (d.framework.steps || []).map(s =>
        '<span class="fw-step">' + escHtml(s.label) + ' <span>— ' + escHtml(s.hint) + '</span></span>').join('') +
      '</div>' +
      '<div class="fw-example-label">A model example, tuned to you</div>' +
      '<div class="fw-example">' + escHtml(d.example) + '</div>';

    document.getElementById('ctaBlock').style.display = 'flex';
  } catch (err) {
    panel.innerHTML = '<div class="teach-loading">' + escHtml(err.message || 'Could not load this framework.') + '</div>';
  }
}

document.getElementById('startBtn').addEventListener('click', () => {
  window.open('practice.html?track=' + encodeURIComponent(track), '_blank');
});

loadFramework();
</script>
<script src="assets/brand.js"></script>
</body>
</html>
