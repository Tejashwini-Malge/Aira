services:
  - type: web
    name: aira
    env: python
    plan: free

    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m gunicorn --chdir backend app:app --bind 0.0.0.0:$PORT

    envVars:
      - key: FLASK_ENV
        value: production

      - key: FLASK_SECRET_KEY
        generateValue: true

      - key: GROQ_API_KEY
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: aira-db
          property: connectionString

databases:
  - name: aira-db
    plan: free